	<script type="text/javascript" src="lib/papaparse.js"></script>

	<script type="text/javascript" src="lib/tailwind.js"></script>

	<style>
		:root {
			--color-scheme: #10ABA2;
			--color-scheme-hover: #069595;
		}
		html {
			font-size: 90%; 
		}
		/* bessere Integration in Tailwind */
		.tabulator {
			border: none;
			background-color: rgb(249 250 251); // bg-gray-50
			height: 100%;
		}
		.tabulator .tabulator-header {
			border-bottom: 1px solid rgb(229 231 235);
			background-color: rgb(241 243 245);
			font-size: 0.8rem;
			font-weight: 500;
		}
		.tabulator .tabulator-row {
			border-bottom: 1px solid rgb(229 231 235);
			background-color: white;
		}
		.tabulator .tabulator-row:hover {
			background-color: rgb(241 243 245) !important;
		}
		.tabulator .tabulator-cell {
			padding: 4px 6px; 
			font-size: 0.85rem;
			border-right: 1px solid rgb(229 231 235); // Hellgraue Spalten Trennlinie
		}
		// Fix für Tick/Cross Editor
		.tabulator-cell[tabulator-field="Fixkosten"] {
			cursor: pointer;
		}
		
		// CSV Spaltenzuordnung
		#mappingInstruction span {
			margin: 0 4px;
			padding: 2px 6px;
			border-radius: 4px;
			font-weight: 500;
			transition: all 0.3s ease;
		}
		#mappingInstruction span.mapped {
			background-color: #d1fae5; /* green-100 */
			color: #065f46; /* green-800 */
			text-decoration: line-through;
		}
		#mappingInstruction span.current {
			background-color: #dbeafe; /* blue-100 */
			color: #1d4ed8; /* blue-700 */
			font-weight: 700;
			box-shadow: 0 0 0 2px #bfdbfe;
		}
		#previewMappingTable th {
			padding: 8px 12px;
			background-color: #f3f4f6; /* gray-200 */
			border: 1px solid #d1d5db;
			cursor: pointer;
			transition: background-color 0.2s;
		}
		#previewMappingTable th:hover {
			background-color: #e5e7eb; /* gray-300 */
		}
		#previewMappingTable th.mapped-header {
			background-color: #d1d5db; /* gray-400 */
			color: #6b7280; /* gray-500 */
			cursor: not-allowed;
			text-decoration: line-through;
		}
		#previewMappingTable td {
			border: 1px solid #e5e7eb;
			padding: 6px 10px;
			font-size: 0.9rem;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			max-width: 200px;
		}
		
		/* Visualisierung -> NavLeiste */ 
		.tab-btn {
			padding: 0.55rem 0.55rem;
			font-size: 0.9rem;
			font-weight: 500;
			color: #6b7280; /* text-gray-500 */
			border-bottom: 2px solid transparent;
			transition: all 0.2s;
			cursor: pointer;
		}
		.tab-btn:hover {
			background-color: #f9fafb; /* bg-gray-50 */
			color: #1f2937; /* text-gray-800 */
		}
		.tab-btn.active {
			color: var(--color-scheme); /* text-blue-600 */
			border-bottom-color: var(--color-scheme); /* border-blue-600 */
		}
		
		/* Visualisierung -> DetailsNav */
		.details-tab-btn {
			padding: 0.5rem 1rem;
			font-size: 0.85rem;
			font-weight: 500;
			color: #4b5563; /* text-gray-600 */
			border-bottom: 2px solid transparent;
			cursor: pointer;
		}
		.details-tab-btn:hover {
			background-color: #f3f4f6; /* bg-gray-200 */
		}
		.details-tab-btn.active {
			font-weight: 700;
			color: #1f2937; /* text-gray-800 */
			background-color: #fff;
			border-top: 1px solid #d1d5db;
			border-left: 1px solid #d1d5db;
			border-right: 1px solid #d1d5db;
			border-bottom: 1px solid #fff; /* Verdeckt die untere Kante */
			border-radius: 0.375rem 0.375rem 0 0;
			position: relative;
			top: 1px; /* Rückt den Tab nach oben */
		}
		
		.text-3xs { font-size: 0.5rem; } /* 8px */
		.text-2xs { font-size: 0.625rem; } /* 10px */
		
	</style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col font-sans">

	<header class="bg-white shadow p-3 flex justify-between items-center z-10">

			</h1>
		<nav id="headerNav" class="hidden flex gap-2">

				</button>
			<button id="navImportBtn" class="px-3 py-1 rounded text-sm transition-colors duration-200"></button>
			<button id="navCategorizeBtn" class="px-3 py-1 rounded text-sm transition-colors duration-200"></button>
			<button id="navVisualizeBtn" class="px-3 py-1 rounded text-sm transition-colors duration-200"></button>
		</nav>
		<div id="headerActions" class="hidden flex gap-4 items-center">
			<button id="resetBtn" class="hidden flex items-center gap-2 bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded transition-colors duration-200">
				</button>
			 <button id="saveJsonBtn" class="hidden flex items-center gap-2 bg-[var(--color-scheme)] hover:bg-[var(--color-scheme-hover)] text-white px-3 py-1 rounded transition-colors duration-200">
				</button>
			 <button id="exportBtn" class="hidden flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded transition-colors duration-200">
				</button>
		</div>
	</header>
	<div id="statusBar" class="hidden bg-blue-50 p-2 text-sm text-blue-800 text-center border-b border-blue-100">
		</div>
	<main id="pageHome" class="flex-1 flex flex-col items-center justify-center p-6">
		<div class="bg-white p-5 rounded-lg shadow-xl text-center w-full max-w-xl"> 
			<i class="fas fa-person text-8xl text-[var(--color-scheme)] mb-8"></i>
			<h2 id="homeWelcomeTitle" class="text-3xl font-bold mb-4" data-i18n="home_welcome_title"></h2>
			<p class="text-gray-600 mb-5 text-lg" data-i18n="home_welcome_text"></p>
			
			<div class="flex flex-col md:flex-row gap-6">
				<button id="startNewBtn" class="flex-1 flex flex-col items-center gap-4 bg-blue-50 hover:bg-blue-100 text-blue-700 p-6 rounded-lg transition-colors duration-200 border border-blue-200 shadow-sm">
					<i class="fas fa-file-import text-4xl"></i>
					<span class="text-xl font-semibold" data-i118n="home_btn_new"></span>
					<span class="text-sm text-gray-600" data-i18n="home_btn_new_desc"></span>
				</button>
				
				<button id="loadSessionBtn" class="flex-1 flex flex-col items-center gap-4 bg-gray-50 hover:bg-gray-100 text-gray-700 p-6 rounded-lg transition-colors duration-200 border border-gray-200 shadow-sm">
					<i class="fas fa-folder-open text-4xl"></i>
					<span class="text-xl font-semibold" data-i18n="home_btn_load"></span>
					<span class="text-sm text-gray-600" data-i18n="home_btn_load_desc"></span>
				</button>
			</div>
			
			<div class="bg-white pt-3 rounded-lg text-center w-full max-w-xl"> 
				<span>b45, by Thorsten 2025</span>

			</div>
		</div>
	</main>

	<main id="pageImport" class="hidden flex-1 flex flex-col items-center justify-center p-6">
		<div id="importInitialStep" class="bg-white p-6 rounded-lg shadow-xl text-center max-w-lg w-full">
			<i class="fas fa-file-import text-6xl text-[var(--color-scheme)] mb-6"></i>
			<h2 class="text-2xl font-semibold mb-4" data-i18n="import_title"></h2>
			<p class="text-gray-600 mb-8" data-i18n="import_desc"></p>
			<div class="flex items-center justify-center gap-6 mb-6">
				<div class="flex items-center gap-2">
					<label for="delimiterInput" class="text-gray-600 font-medium" data-i18n="label_delimiter"></label>
					<input type="text" id="delimiterInput" value=";" maxlength="1" class="w-12 p-2 border rounded focus:ring-2 focus:ring-[var(--color-scheme)] outline-none text-center font-mono" title="CSV Trennzeichen" />
				</div>
				</div>

			<label class="w-full flex items-center justify-center gap-2 bg-[var(--color-scheme)] hover:bg-[var(--color-scheme-hover)] text-white px-6 py-3 rounded-lg cursor-pointer transition-colors duration-200 text-lg font-medium">
				<i class="fas fa-upload"></i>
				<span data-i18n="btn_import_csv"></span>
				<input type="file" id="csvInput" accept=".csv" class="hidden" />
			</label>
		</div>

		<div id="importMappingStep" class="hidden bg-white p-6 rounded-lg shadow-xl max-w-4xl w-full">
			<h2 class="text-2xl font-semibold mb-4 text-center" data-i18n="mapping_title"></h2>
			<p id="mappingInstruction" class="text-gray-700 text-center mb-6 p-4 bg-gray-50 rounded border">
				</p>
				
			<div class="overflow-x-auto border rounded-lg">
				<table id="previewMappingTable" class="w-full min-w-full text-left table-auto">
					<thead id="previewMappingTableHead">
						</thead>
					<tbody id="previewMappingTableBody">
						</tbody>
				</table>
			</div>
			
			<button id="cancelMappingBtn" class="mt-6 w-full bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded transition-colors duration-200" data-i18n="mapping_btn_cancel">
			</button>
		</div>

	</main>

	<main id="pageLoadJson" class="hidden flex-1 flex flex-col items-center justify-center p-6">
		<div class="bg-white p-6 rounded-lg shadow-xl text-center max-w-lg w-full">
			<i class="fas fa-folder-open text-6xl text-[var(--color-scheme)] mb-6"></i>
			<h2 class="text-2xl font-semibold mb-4" data-i18n="load_json_title"></h2>
			<p class="text-gray-600 mb-6" data-i18n="load_json_desc"></p>
			
			<div class="mb-8 flex items-center justify-center gap-3 bg-gray-50 p-3 rounded border border-gray-100">
				<input type="checkbox" id="onlySetChk" class="w-4 h-4 text-[var(--color-scheme)] border-gray-300 rounded focus:ring-[var(--color-scheme)] cursor-pointer">
				<label for="onlySetsBox" class="text-sm text-gray-600 cursor-pointer select-none" data-i18n="load_settings_only"></label>
			</div>

			<label class="w-full flex items-center justify-center gap-2 bg-[var(--color-scheme)] hover:bg-[var(--color-scheme-hover)] text-white px-6 py-3 rounded-lg cursor-pointer transition-colors duration-200 text-lg font-medium">
				<i class="fas fa-upload"></i>
				<span data-i18n="btn_load_json"></span>
				<input type="file" id="jsonInput" accept=".json" class="hidden" />
			</label>
		</div>
	</main>

	<main id="pageCategorize" class="hidden flex-1 flex flex-col overflow-hidden p-4 lg:p-6 w-full mx-auto">
		
		<section class="flex-1 flex flex-col overflow-hidden mb-4">
			 <div id="table-container" class="flex-1 bg-white rounded shadow overflow-hidden relative">
				 <div id="emptyState" class="hidden absolute inset-0 flex flex-col items-center justify-center text-gray-400">
					 <i class="fas fa-table text-6xl mb-4 opacity-20"></i>
					 <p class="text-xl" data-i18n="categorize_table_empty"></p>
					 <p class="text-sm" data-i18n="categorize_table_empty_sub"></p>
				 </div>
				 <div id="data-table"></div>
			 </div>
		</section>

		<section class="flex gap-4 h-[310px]">
			
			<div class="w-1/3 max-w-lg bg-white flex flex-col overflow-hidden rounded-lg shadow">
				<div class="p-4 bg-gray-50">
					<h2 id="rulesTitle" class="font-semibold text-lg mb-4">
						</h2>
					
					<div class="bg-white p-3 rounded shadow-sm space-y-3">
						<div>
							<label class="block text-xs font-bold text-gray-500 uppercase mb-1" data-i18n="rules_search_label"></label>
							<input type="text" id="ruleSearch" placeholder="z.B. Miete..." class="w-full p-1 border rounded focus:ring-2 focus:ring-[var(--color-scheme)] outline-none" disabled /> 
							<div class="text-xs text-gray-500 mt-1 text-right" id="matchCountPreview">0 <span data-i18n="rules_match_preview"></span></div>
						</div>
						<div>
							<label class="block text-xs font-bold text-gray-500 uppercase mb-1" data-i18n="rules_category_label"></label>

							<datalist id="categoryDatalist">
								</datalist>
						</div>
						
						<div class="flex items-center pt-1">
							<input type="checkbox" id="ruleFixkostenCheckbox" class="h-4 w-4 text-[var(--color-scheme)] border-gray-300 rounded focus:ring-[var(--color-scheme)]" disabled>

							</label>
						</div>
						
						<div class="pt-2">
							<button id="saveRuleBtn" class="w-full bg-[var(--color-scheme)] hover:bg-[var(--color-scheme-hover)] text-white px-3 py-2 rounded text-sm transition-colors duration-200" disabled>

							</button>
						</div>
					</div>
				</div>
			</div>

			<div class="flex-1 bg-white border border-gray-200 flex flex-col overflow-hidden rounded-lg shadow">

						<div class="flex gap-2">

							</button>
							<button id="runAllRulesBtn" class="hidden text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 px-2 py-1 rounded transition-colors duration-200">
								<i class="fas fa-forward"></i> <span data-i18n="rules_btn_run_all"></span>
							</button>
						</div>
					</div>
					<ul id="rulesList" class="space-y-1">
						<li class="text-gray-500 text-sm italic text-center pt-4" data-i18n="rules_list_empty"></li>
					</ul>
				</div>
			</div>
		</section>
	</main>

						</div>
					</div>
				</div>
			</div>
		</div>

		<div id="visContentLines" class="hidden flex-1 flex flex-col">
			
			<div class="py-2 border-b border-gray-300 bg-gray-50 grid place-items-center">
				<div class="inline-flex rounded-md shadow-sm" role="group">
					<button type="button" id="visLinesAllBtn" class="px-3 py-1 text-sm font-medium text-white bg-[var(--color-scheme)] border border-[var(--color-scheme)] rounded-l-lg hover:bg-[var(--color-scheme-hover)]">
						<i class="fas mr-2"></i> <span data-i18n="vis_lines_all">Alle</span>
					</button>
					<button type="button" id="visLinesTopBtn" class="px-3 py-1 text-sm font-medium text-gray-900 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100">
						<i class="fas fa-layer-group mr-2"></i> <span data-i18n="vis_lines_top">Top</span>
					</button>
				</div>
			</div>
			
			<div class="flex-1 border border-t-0 border-gray-300 rounded-b-md bg-gray-50 flex flex-col overflow-hidden"> 
				
				<div class="flex-1 w-full max-w-4xl mx-auto flex items-center justify-center p-4 relative">

		/**
		 * Zeigt eine Statusleiste am oberen Rand der Seite an.
		 * @param {string} msgKey   Der Schlüssel für die Übersetzungsfunktion L().
		 * @param {string} [type='info']   Der Typ der Nachricht ('info', 'success', 'error').
		 * @param {...*} args   Argumente, die an die Übersetzungsfunktion L() übergeben werden.
		 */
		function showStatus(msgKey, type = 'info', ...args) {
			const msg = L(msgKey, ...args);
			
			DOM.statusBar.textContent = msg;
			DOM.statusBar.classList.remove('hidden', 'bg-blue-50', 'text-blue-800', 'bg-red-50', 'text-red-800', 'bg-green-50', 'text-green-800');

			if (type === 'error') DOM.statusBar.classList.add('bg-red-50', 'text-red-800');
			else if (type === 'success') DOM.statusBar.classList.add('bg-green-50', 'text-green-800');
			else DOM.statusBar.classList.add('bg-blue-50', 'text-blue-800');

			DOM.statusBar.classList.remove('hidden');
			setTimeout(() => DOM.statusBar.classList.add('hidden'), 5000);
		}

		/**
		 * Zeigt ein modales Bestätigungsfenster an.
		 */
		function showConfirmationModal(titleKey, messageKey, confirmTextKey = 'modal_btn_confirm', args = [], isInfo = false) {
			return new Promise(resolve => {
				if (!titleKey || !messageKey) {
					resolve(false)
					return
				}
				DOM.modalTitle.textContent = L(titleKey);
				DOM.modalMessage.innerHTML = L(messageKey, ...args);
				DOM.modalConfirmBtn.textContent = L(confirmTextKey);
				
				DOM.modalConfirmBtn.classList.toggle('hidden', isInfo); 
				DOM.modalCancelBtn.textContent = isInfo ? L("modal_btn_close") : L("modal_btn_cancel");
				
				DOM.modalTitle.classList.toggle('text-red-600', !isInfo);
				DOM.modalTitle.classList.toggle('text-[var(--color-scheme)]', isInfo);

				DOM.confirmationModal.classList.remove('hidden');
				setTimeout(() => {
					DOM.modalContent.classList.remove('scale-95', 'opacity-0');
				}, 10);

				const confirmHandler = () => {
					closeModal();
					resolve(true);
				};
				const cancelHandler = () => {
					closeModal();
					resolve(false);
				};

				const closeModal = () => {
					DOM.modalContent.classList.add('scale-95', 'opacity-0');
					setTimeout(() => {
						DOM.confirmationModal.classList.add('hidden');
					}, 300);
					
					DOM.modalConfirmBtn.removeEventListener('click', confirmHandler);
					DOM.modalCancelBtn.removeEventListener('click', cancelHandler);
					DOM.modalCancelBtn.textContent = L("modal_btn_cancel"); 
				};

				DOM.modalConfirmBtn.addEventListener('click', confirmHandler);
				DOM.modalCancelBtn.addEventListener('click', cancelHandler);
			});

		/**
		 * Parst ein Datum (String oder Date) und gibt ein Date Objekt oder null zurück.
		 * Unterstützt: YYYY-MM-DD, YYYYMMDD, DD.MM.YYYY, MM/DD/YYYY.
		 */
		function parseGermanDate(dateStr) {
			if (!dateStr) return null;
			if (dateStr instanceof Date) return isNaN(dateStr.getTime()) ? null : dateStr;

			let s = String(dateStr).trim();
			if (s === '') return null;

			s = s.split('T')[0].split(' ')[0].trim();

			// ISO / einfache Formate
			if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(s)) {
				const d = new Date(s.replace(/\//g, '-'));
				return isNaN(d.getTime()) ? null : d;
			}

			// Kompaktformat YYYYMMDD
			if (/^\d{8}$/.test(s)) {
				const y = +s.slice(0, 4);
				const m = +s.slice(4, 6);
				const d = +s.slice(6, 8);
				const date = new Date(y, m - 1, d);
				return isNaN(date.getTime()) ? null : date;
			}

			// Europäisches Format DD.MM.YYYY
			if (/^\d{1,2}\.\d{1,2}\.\d{2,4}$/.test(s)) {
				const [d, m, y] = s.split('.').map(v => parseInt(v, 10));
				const year = y < 100 ? (y < 70 ? 2000 + y : 1900 + y) : y;  // 2069 todo :) use a rolling date here
				const date = new Date(year, m - 1, d);
				return isNaN(date.getTime()) ? null : date;
			}

			// US Format MM/DD/YYYY
			if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)) {
				const [m, d, y] = s.split('/').map(v => parseInt(v, 10));
				const year = y < 100 ? (y < 70 ? 2000 + y : 1900 + y) : y;
				const date = new Date(year, m - 1, d);
				return isNaN(date.getTime()) ? null : date;
			}
			
			//  weirdes Format. LastExit: Frage den Browser...
			// console.log("Debug: Date parsing fallback triggered for string:", s);
			
			const fallback = new Date(s);
			
			// Check ob der Fallback geklappt hat sonst Invalid Date.
			if (isNaN(fallback.getTime())) {
				console.log("Debug: Parsing completely failed for:", s);
				return null;
			}
			
			return fallback;
		}

		/**
		 * Parst einen Zahlen String robust und gibt eine Zahl zurück.
		 */
		function parseGermanNumber(numStr) {
			if (numStr === null || numStr === undefined) return 0;
			if (typeof numStr === 'number' && !isNaN(numStr)) return numStr;

			let s = String(numStr).trim();
			if (s === '') return 0;

			const isNegative = /^\s*\(.*\)\s*$/.test(s);
			
			const cleanedS = s.replace(/[^0-9\.,\-\+eE\s\u00A0\u202F']/g, '')
							.replace(/[\s\u00A0\u202F']/g, '')
							.replace(/^\s*\(|\)\s*$/g, ''); 
			
			const lastComma = cleanedS.lastIndexOf(',');
			const lastDot = cleanedS.lastIndexOf('.');
			
			let processedS = cleanedS;

			// Heuristik: Ob Komma oder Punkt der Dezimaltrenner ist, basierend auf der Position.
			if (lastComma !== -1 && lastDot !== -1) {
				if (lastComma > lastDot) processedS = cleanedS.replace(/\./g, '').replace(',', '.');
				else processedS = cleanedS.replace(/,/g, '');
			} else if (lastComma !== -1) {
				const after = cleanedS.slice(lastComma + 1);
				processedS = (/^\d{1,3}$/.test(after)) ? cleanedS.replace(',', '.') : cleanedS.replace(/,/g, '');
			} else if (lastDot !== -1) {
				const after = cleanedS.slice(lastDot + 1);
				if (!/^\d{1,3}$/.test(after)) processedS = cleanedS.replace(/\./g, '');
			}

			processedS = processedS.replace(/[^0-9\.\-\+eE]/g, '');

			let parsed = parseFloat(processedS);
			
			if (isNaN(parsed)) {
				// console.log("Debug: Number parsing failed completely for", numStr);
				parsed = 0;
			}
			if (isNegative) parsed = -Math.abs(parsed);
			
			return parsed;
		}

		function formatDateForInput(dateObj) {
			if (!dateObj || isNaN(dateObj.getTime())) return '';
			return dateObj.toISOString().split('T')[0];
		}

		function updateTexts() {

						} else if (el.placeholder) {
							el.placeholder = text;

					} else if (el.tagName === 'BUTTON') {
						let textNode = Array.from(el.childNodes).find(node => node.nodeType === 3 || (node.nodeType === 1 && node.tagName === 'SPAN'));
						if (textNode) {
							if(textNode.nodeType === 3) textNode.textContent = text;
							else textNode.textContent = text;
						} else {
							el.textContent = text; 
						}
					} else {
						el.textContent = text;
					}
				}

				if (el.hasAttribute('data-i18n-title')) {
					const titleKey = el.getAttribute('data-i18n-title');
					el.title = L(titleKey);

			});
			
			DOM.navHomeBtn.innerHTML = `<i class="fas fa-home"></i> ${L('nav_home')}`;

	/**
	 * @namespace Store
	 * @description Singleton für das zentrale State Management (Pub/Sub).
	 */
	const Store = (function() {
		const _initialState = {
			tableData: [],
			savedRules: [],
			currentCurrency: DOM.DEFAULT_CURRENCY
		};
		
		let _state = { ..._initialState };
		let _listeners = [];

		function _emit(eventType = 'session_changed') {
			const stateCopy = { ..._state };
			_listeners.forEach(listener => listener(stateCopy, eventType));
		}
		
		function _applyRuleToData(rule, dataSet) {
			if (!rule.search) return 0;
			let appliedCount = 0;
			const term = rule.search.toLowerCase();
			
			dataSet.forEach(row => {
				if (row.manual) return;

				const purposeMatch = (row["Verwendungszweck"] || '').toLowerCase().includes(term);
				
				if (purposeMatch) {
					row['Kategorie'] = rule.category;
					if (rule.isFixkosten) {
						row['Fixkosten'] = 1;
					}
					appliedCount++;
				}
			});
			return appliedCount;
		}

		return {
			subscribe: function(callback) {
				_listeners.push(callback);
			},

			getState: function() {
				return { ..._state };
			},

			setTableData: function(data) {
				_state.tableData = Array.isArray(data) ? data : [];
				_emit('session_changed'); 
			},
			
			updateTableDataField: function(rowId, field, newValue) {
				// Quick Check ob rowId valid ist, um Crash bei undefined zu preventen
				if (!rowId && rowId !== 0) {
					// console.error("Update aborted: invalid rowId", rowId);
					return;
				}

				const index = _state.tableData.findIndex(row => row.id == rowId);

				if (index !== -1) {
					let updatedRow = { ..._state.tableData[index] };
					
					// Bleibt unkommentiert, damit wir den Data Flow live tracen können.
					console.log(`Debug: Updating row ${rowId}, field: ${field} ->`, newValue);

					updatedRow[field] = newValue;
					
					// Manuelle edits flaggen damit wir die nich überschreiben.
					if (field === 'Kategorie') {
						updatedRow.manual = true;
					}
					
					updatedRow.Fixkosten = updatedRow.Fixkosten ? 1 : 0; 
					const dateObj = Utils.parseGermanDate(updatedRow.Buchungstag);
					updatedRow.Buchungstag = dateObj ? Utils.formatDateForInput(dateObj) : '';
					updatedRow.Betrag = Utils.parseGermanNumber(updatedRow.Betrag);
					
					_state.tableData[index] = updatedRow;
					_emit('data_changed'); 
					
				} else {
					// Edge Case: Tabulator hat noch die alte ID, aber der State ist schon updated.
					console.log("Debug: Store update failed, rowId not found in current state", rowId);
				}
			},

			setRules: function(rules) {
				_state.savedRules = Array.isArray(rules) ? rules : [];
				_emit('session_changed');
			},
			
			setCurrency: function(currency) {
				_state.currentCurrency = currency || DOM.DEFAULT_CURRENCY;
				_emit('session_changed');
			},

			loadState: function(data, rules, currency) {
				// daten + regeln sanitizen
				_state.tableData = (data || []).map(row => ({ 
					...row, 
					Betrag: Utils.parseGermanNumber(row.Betrag),
					Fixkosten: row.Fixkosten ? 1 : 0,
					// kategorie in den daten lowercasen
					Kategorie: (row.Kategorie || "").toLowerCase()
				}));
				
				_state.savedRules = (rules || []).map(rule => ({ 
					...rule, 
					search: (rule.search || "").toLowerCase(),
					category: (rule.category || "").toLowerCase(),
					isFixkosten: rule.isFixkosten || false 
				}));
				
				_state.currentCurrency = currency || DOM.DEFAULT_CURRENCY;
				
				DOM.delimiterInput.value = ";"; 
				_emit('session_changed');
				
				Utils.showStatus("msg_json_loaded", 'success', _state.tableData.length, _state.savedRules.length);
			},

			reset: function() {
				_state = { ..._initialState };
				_emit('session_changed'); 
			},
			
			addRule: function(search, category, isFixkosten) {
				if (!search || !category) return;
				
				const exists = _state.savedRules.some(r => r.search === search && r.category === category && r.isFixkosten === isFixkosten);
				
				if (!exists) {
					_state.savedRules.push({ search, category, isFixkosten });
					const affected = _applyRuleToData({ search, category, isFixkosten }, _state.tableData);
					Utils.showStatus("msg_rule_saved", 'success', affected);
					_emit('session_changed');
				} else {
					Utils.showStatus("msg_rule_exists", 'error');
				}
			},
			
			deleteRule: function(index) {
				if (index < 0 || index >= _state.savedRules.length) return;
				
				_state.savedRules.splice(index, 1);
				
				const totalAffected = this.applyAllRules(true); 
				Utils.showStatus("msg_rule_deleted_reapplied", 'success', totalAffected);
				
				_emit('session_changed');
			},
			
			deleteAllRules: function() {
				if (_state.savedRules.length === 0) {
					Utils.showStatus("msg_no_rules_to_delete", 'info');
					return;
				}
				
				_state.savedRules = [];
				const totalAffected = this.applyAllRules(true); 
				Utils.showStatus("msg_rules_deleted", 'success');
				_emit('session_changed');
			},

			applyAllRules: function(silent = false) {
				let totalAffected = 0;
				
				// Kategorien nur resetten wenn sie nicht manuell editiert wurden
				_state.tableData.forEach(row => {
					if (!row.manual) {
						row.Kategorie = "";
						row.Fixkosten = 0;
					}
				});

				_state.savedRules.forEach(rule => {
					totalAffected += _applyRuleToData(rule, _state.tableData);
				});
				
				if (!silent) {
					_emit('session_changed');
				}
				return totalAffected;
			},
			
			countMatches: function(searchTerm) {
				if (!searchTerm || _state.tableData.length === 0) return 0;
				const term = searchTerm.toLowerCase();
				
				return _state.tableData.filter(row => 
					(row["Verwendungszweck"] || '').toLowerCase().includes(term)
				).length;
			}
		};
	})();


	/**
	 * @namespace ImportModule
	 * @description Verwaltet den CSV Import, das Spalten Mapping und das Laden von JSON Sitzungen.
	 */
	const ImportModule = (function() {
		let _pendingData = [];
		let _pendingHeaders = [];
		let _fieldMappings = {};
		let _currentMappingIndex = 0;

		function _setupMappingStep(headers, previewData) {
			DOM.importInitialStep.classList.add('hidden');
			DOM.importMappingStep.classList.remove('hidden');

			_currentMappingIndex = 0;
			_fieldMappings = {};

			_updateMappingInstructionUI();

			DOM.previewMappingTableHead.innerHTML = '';
			const trHead = document.createElement('tr');
			headers.forEach(header => {
				const th = document.createElement('th');
				th.textContent = header;
				th.addEventListener('click', _handleHeaderClick);
				trHead.appendChild(th);
			});
			DOM.previewMappingTableHead.appendChild(trHead);

			DOM.previewMappingTableBody.innerHTML = '';
			previewData.forEach(row => {
				const tr = document.createElement('tr');
				headers.forEach(header => {
					const td = document.createElement('td');
					td.textContent = row[header] || '';
					tr.appendChild(td);
				});
				DOM.previewMappingTableBody.appendChild(tr);
			});
		}

		function _updateMappingInstructionUI() {
			DOM.MAPPING_FIELDS.forEach((field, index) => {
				const span = document.getElementById(`map-label-${field}`);
				if (!span) return;
				
				span.classList.remove('mapped', 'current');
				
				if (index < _currentMappingIndex) {
					span.classList.add('mapped');
				} else if (index === _currentMappingIndex) {
					span.classList.add('current');
				}
			});
		}

		function _handleHeaderClick(event) {
			const th = event.target;
			const clickedHeader = th.textContent;

			if (_currentMappingIndex >= DOM.MAPPING_FIELDS.length || th.classList.contains('mapped-header')) {
				return;
			}

			const fieldToMap = DOM.MAPPING_FIELDS[_currentMappingIndex];
			_fieldMappings[fieldToMap] = clickedHeader;

			th.classList.add('mapped-header');
			_currentMappingIndex++;
			_updateMappingInstructionUI();

			if (_currentMappingIndex === DOM.MAPPING_FIELDS.length) {
				Utils.showStatus('msg_all_fields_mapped', 'success');
				setTimeout(_finishImportProcess, 500);
			}
		}
		
		function _cancelMapping() {
			DOM.importMappingStep.classList.add('hidden');
			DOM.importInitialStep.classList.remove('hidden');
			_pendingData = [];
			_pendingHeaders = [];
			_fieldMappings = {};
			_currentMappingIndex = 0;
			Utils.showStatus('msg_import_canceled', 'info');
			MainController.showPage('import'); 
		}

		function _finishImportProcess() {
			// Wenn Kategorie oder Fixkosten im csv, nutze sie.
			const csvCatHeader = _pendingHeaders.find(h => h.toLowerCase() === 'kategorie');
			const csvFixHeader = _pendingHeaders.find(h => h.toLowerCase() === 'fixkosten' || h.toLowerCase() === 'fix');

			const { tableData } = Store.getState();
			let nextId = 1;

			// Hole die höchste ID im Bestands
			if (tableData && tableData.length > 0) {
				const maxId = Math.max(...tableData.map(r => (typeof r.id === 'number' ? r.id : 0)));
				nextId = maxId + 1;
			}

			// console.log("DEBUG: Starting import with nextId: ", nextId);

			const importData = _pendingData.map((row, index) => {
				const newRow = { id: nextId + index };

				for (const [targetField, csvColName] of Object.entries(_fieldMappings)) {
					const rawVal = row[csvColName];

					if (targetField === 'Buchungstag') {
						const dateObj = Utils.parseGermanDate(rawVal);
						// ins ISO Format normalisieren
						newRow[targetField] = dateObj ? Utils.formatDateForInput(dateObj) : '';
					} else if (targetField === 'Betrag') {
						newRow[targetField] = Utils.parseGermanNumber(rawVal);
					} else {
						newRow[targetField] = rawVal || '';
					}
				}
				
				// Kate und Fixk Spalten aus Import übernehmen 
				const rawCat = csvCatHeader ? (row[csvCatHeader] || "") : "";
				newRow['Kategorie'] = rawCat.toLowerCase();
				
				if (csvFixHeader) {
					const rawFix = String(row[csvFixHeader] || '').toLowerCase().trim();
					// wilde Bool Formate zähmen
					newRow['Fixkosten'] = (rawFix === '1' || rawFix === 'true' || rawFix === 'ja' || rawFix === 'x' || rawFix === 'wahr') ? 1 : 0;
				} else {
					newRow['Fixkosten'] = 0;
				}
				
				return newRow;
			});
			
			if (importData.length > 0) {
				// Append Data
				const mergedData = [...tableData, ...importData];

				// // console.log("DEBUG: Merged size: ", mergedData.length);

				Store.setTableData(mergedData);
				
				const { savedRules } = Store.getState();
				if (savedRules.length > 0) {
					const affected = Store.applyAllRules();
					Utils.showStatus("msg_rules_applied_on_import", 'success', affected);
				}
			}

			_pendingData = [];
			_pendingHeaders = [];
			
			DOM.importMappingStep.classList.add('hidden');
			DOM.importInitialStep.classList.remove('hidden');
			
			MainController.showPage('categorize');
		}
		
		function _handleCsvInput(e) {
			const file = e.target.files[0];
			if (!file) return;

			const delimiter = DOM.delimiterInput.value || ';';
		   
			Papa.parse(file, {
				delimiter: delimiter,
				header: true,
				skipEmptyLines: true,
				complete: function(results) {
					if ((results.errors.length > 0 && results.data.length === 0) || !results.meta.fields) {
						Utils.showStatus("msg_parsing_error", 'error');
						console.log("Debug: CSV Parse Error", results.errors);
						return;
					}

					_pendingData = results.data;
					_pendingHeaders = results.meta.fields;

					_setupMappingStep(_pendingHeaders, _pendingData.slice(0, 4));
				},
				error: function(err) {
					Utils.showStatus("msg_crit_error", 'error', err.message);
				}
			});
			DOM.csvInput.value = '';
		}
		
		function _handleJsonInput(e) {
			const file = e.target.files[0];
			if (!file) return;
			//2512 onlyRuleflg um bestehende Regeln auf frische Daten anzuwenden.
			const onlySetChk = document.getElementById('onlySetChk');
			const onlySetFlg = onlySetChk ? onlySetChk.checked : false;
			const reader = new FileReader();
			reader.onload = function(event) {
				try {
					const text = event.target.result;
					const parsedData = JSON.parse(text);
					if (!parsedData || !Array.isArray(parsedData.data) || !Array.isArray(parsedData.rules)) throw new Error(L("msg_json_invalid"));
					const dataToLoad = onlySetFlg ? [] : parsedData.data;
					Store.loadState(dataToLoad, parsedData.rules, parsedData.currency);
					MainController.showPage('visualize'); 
				} catch (err) { Utils.showStatus("msg_crit_error", 'error', err.message); Store.reset(); }
			};
			reader.onerror = function() { Utils.showStatus("msg_crit_error", 'error', "Fehler beim Lesen"); };
			reader.readAsText(file);
			DOM.jsonInput.value = '';
		}

		return {
			init: function() {
				DOM.startNewBtn.addEventListener('click', () => MainController.showPage('import'));
				DOM.loadSessionBtn.addEventListener('click', () => MainController.showPage('loadJson'));
				DOM.csvInput.addEventListener('change', _handleCsvInput);
				DOM.jsonInput.addEventListener('change', _handleJsonInput);
				DOM.cancelMappingBtn.addEventListener('click', _cancelMapping);
			}
		};
	})();


	/**
	 * @namespace CategorizeModule
	 * @description Verwaltet die Haupt Daten Tabelle (Tabulator) und die Regel UI.
	 */
	const CategorizeModule = (function() {
		let _tableInstance = null;
		let _isInitialized = false;
		let _tableReadyPromise = null;

		function _initTable(data) {
			if (_tableInstance) _tableInstance.destroy();
			
			DOM.emptyState.classList.add('hidden');
			const { currentCurrency } = Store.getState();
			const knownColumns = {
				"Buchungstag": { 
					title: L("Buchungstag"),
					editor: "date",
					width: 90, 
					sorter: function(a, b) {
						const dateA = a ? new Date(a) : null;
						const dateB = b ? new Date(b) : null;
						if (dateA === null && dateB === null) return 0;
						if (dateA === null) return -1; 
						if (dateB === null) return 1;
						return dateA.getTime() - dateB.getTime();
					},
					cellEdited: function(cell) {
							const id = cell.getRow().getData().id;
							const newValue = cell.getValue();
							Store.updateTableDataField(id, "Buchungstag", newValue);
						}
				},
				"Verwendungszweck": { title: L("Verwendungszweck"), sorter: "string", headerFilter:"input", formatter: "textarea", minWidth: 200, 
					cellEdited: function(cell) {
							const id = cell.getRow().getData().id;
							const newValue = cell.getValue();
							Store.updateTableDataField(id, "Verwendungszweck", newValue);
						}
				},
				"Betrag": { title: L("Betrag"), sorter: "number", hozAlign: "right", width: 100, 
					editor: "number",
					formatter:"money", formatterParams:{decimal:",", thousand:".", symbol: currentCurrency, symbolAfter:true},
					cellEdited: function(cell) {
						const id = cell.getRow().getData().id;
						const newValue = cell.getValue();
						Store.updateTableDataField(id, "Betrag", newValue);
					}							
				},
				"Kategorie": { title: L("Kategorie"), sorter: "string", headerFilter:"input", width: 120,
					editor: "input",
					formatter: function(cell) {
						const val = cell.getValue();
						if (!val) return `<span class="text-gray-300 italic text-xs">${L('category_placeholder')}</span>`; 
						return `<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-xs font-semibold">${val}</span>`;
					},
					cellEdited: function(cell) {
						const id = cell.getRow().getData().id;
						const rawVal = cell.getValue() || "";
						const lowVal = rawVal.toLowerCase();
						// console.log("debug: cat changed to " + lowVal);
						Store.updateTableDataField(id, "Kategorie", lowVal);
					}
				},
				"Fixkosten": { title: L("Fixkosten"), sorter: "boolean", hozAlign: "center", width: 60, 
					formatter: "tickCross", 
					cellClick: function(e, cell) { 
						const id = cell.getRow().getData().id;
						const newValue = !cell.getValue();
						cell.setValue(newValue); 
						Store.updateTableDataField(id, "Fixkosten", newValue);
					}
				}
			};

			const columns = [];
			if (!data || data.length === 0) {
				DOM.emptyState.classList.remove('hidden');
				return;
			}
			
			const dataKeys = Object.keys(data[0]).filter(key => key !== 'id');
			const knownKeys = Object.keys(knownColumns);
			
			knownKeys.forEach(key => {
				if (key !== 'Kategorie' && key !== 'Fixkosten' && dataKeys.includes(key)) {
					columns.push({ ...knownColumns[key], field: key });
				}
			});
			
			if (dataKeys.includes('Kategorie')) columns.push({ ...knownColumns['Kategorie'], field: 'Kategorie' });
			if (dataKeys.includes('Fixkosten')) columns.push({ ...knownColumns['Fixkosten'], field: 'Fixkosten' });

			_tableReadyPromise = new Promise((resolve) => {
				_tableInstance = new Tabulator("#data-table", {
					data: data,
					layout: "fitColumns",
					height: "100%",
					columns: columns,
					movableColumns: true,
					resizableRows: true,
					initialSort: [
						{ column: "Buchungstag", dir: "desc" }
					],
					index: "id",
					tableBuilt: function() {
						resolve();
					}
				});
			});
		}

		function _getAllCategories(state) {
			const categories = new Set();
			
			state.tableData.forEach(row => {
				if (row.Kategorie) {
					categories.add(row.Kategorie.trim());
				}
			});

			state.savedRules.forEach(rule => {
				if (rule.category) {
					categories.add(rule.category.trim());
				}
			});

			categories.delete('');
			return categories;
		}

		function _renderCategoryDatalist(state) {
			const categories = _getAllCategories(state);
			const datalistEl = DOM.categoryDatalist;
			
			datalistEl.innerHTML = '';
			
			Array.from(categories).sort().forEach(cat => {
				const option = document.createElement('option');
				option.value = cat;
				datalistEl.appendChild(option);
			});
		}

		function _updateMatchCountAndButtonState() {
			const searchTerm = DOM.ruleSearch.value.trim();
			const categoryValue = DOM.ruleCategory.value.trim();
			const count = Store.countMatches(searchTerm);
			
			DOM.matchCountPreview.innerHTML = `${count} <span data-i18n="rules_match_preview"></span>`;
			Utils.updateTexts();

			const hasInput = searchTerm.length > 0 && categoryValue.length > 0;
			const isInputEnabled = !DOM.ruleSearch.disabled;
			
			DOM.saveRuleBtn.disabled = !(hasInput && isInputEnabled);
		}

		function _updateMatchPreviewAndFilter() {
			_updateMatchCountAndButtonState();
			const searchTerm = DOM.ruleSearch.value.trim();
			
			if (_tableInstance) {
				if (searchTerm.length > 0) {
					_tableInstance.setFilter("Verwendungszweck", "like", searchTerm);
				} else {
					_tableInstance.clearFilter();
				}
			}
		}

		function _renderRulesList(rules) {
			DOM.rulesList.innerHTML = '';
			
			if (rules.length === 0) {
				DOM.rulesList.innerHTML = `<li class="text-gray-500 text-sm italic text-center pt-4" data-i18n="rules_list_empty"></li>`;
				Utils.updateTexts(); 
				DOM.runAllRulesBtn.classList.add('hidden');
				DOM.deleteAllRulesBtn.classList.add('hidden');
				return;
			}
			
			DOM.runAllRulesBtn.classList.remove('hidden');
			DOM.deleteAllRulesBtn.classList.remove('hidden');

			rules.forEach((rule, index) => {
				const li = document.createElement('li');
				li.className = "bg-white p-1 rounded border border-gray-200 flex items-center";
				
				const fixkostenIcon = rule.isFixkosten 
					? `<i class="fas fa-file-invoice-dollar text-xs text-purple-500 ml-1" title="${L('Fixkosten')}"></i>`
					: '';
				
				li.innerHTML = `
					<div class="flex justify-between items-center w-full text-xs">  <div class="flex-grow text-xs truncate flex items-center">
							<span class="font-medium text-gray-800">"${rule.search}"</span>
							<i class="fas fa-arrow-right text-xs text-[var(--color-scheme)] mx-1"></i> <span class="font-semibold bg-blue-100 text-blue-800 px-1 py-0.5 rounded-full text-3xs">${rule.category}</span> ${fixkostenIcon}
						</div>
						<button data-index="${index}" class="delete-rule-btn flex-shrink-0 text-gray-400 hover:text-red-600 transition ml-2 px-1 py-0.5" title="${L('rules_btn_delete')}"> <i class="fas fa-trash-alt fa-xs"></i> </button>
					</div>
				`;
				li.querySelector('.delete-rule-btn').addEventListener('click', _handleDeleteRuleClick);
				DOM.rulesList.appendChild(li);
				IconLoader.run(li);
			});
		}
	
		async function _handleSaveRule() {
			const search = DOM.ruleSearch.value.trim().toLowerCase();
			const cat = DOM.ruleCategory.value.trim().toLowerCase(); 
			const isFixkosten = DOM.ruleFixkostenCheckbox.checked;
			
			if (!search || !cat) {
				Utils.showStatus("msg_rule_missing_fields", 'error'); 
				return;
			}
			
			Store.addRule(search, cat, isFixkosten);
			
			DOM.ruleSearch.value = '';
			DOM.ruleCategory.value = ''; 
			DOM.ruleFixkostenCheckbox.checked = false;
			
			if (_tableInstance && _tableReadyPromise) {
				await _tableReadyPromise; 
				_tableInstance.clearFilter();
			}
			
			_updateMatchCountAndButtonState();
		}

		async function _handleRunAllRules() {
			const { tableData, savedRules } = Store.getState();
			if (tableData.length === 0 || savedRules.length === 0) return;
			
			const totalAffected = Store.applyAllRules(); 
			Utils.showStatus("msg_rules_applied", 'success', totalAffected);
			
			if (_tableInstance && _tableReadyPromise) {
				await _tableReadyPromise;
				_tableInstance.clearFilter();
			}
		}

		async function _handleDeleteAllRules() {
			const { savedRules } = Store.getState();
			if (savedRules.length === 0) {
				Utils.showStatus("msg_no_rules_to_delete", 'info');
				return;
			}

			const isConfirmed = await Utils.showConfirmationModal(
				"confirm_delete_all_rules_title",
				"confirm_delete_all_rules_message",
				"confirm_delete_all_rules_btn",
				[savedRules.length] 
			);
			
			if (isConfirmed) {
				Store.deleteAllRules();
			}
		}
		
		async function _handleDeleteRuleClick(e) {
			const index = parseInt(e.currentTarget.dataset.index, 10);
			const { savedRules } = Store.getState();
			const rule = savedRules[index];

			if (!rule) return;

			const isConfirmed = await Utils.showConfirmationModal(
				"confirm_delete_rule_title",
				"confirm_delete_rule_message",
				"confirm_delete_rule_btn",
				[rule.search, rule.category] 
			);

			if (isConfirmed) { 
				Store.deleteRule(index);
			}
		}
		
		function _onStoreUpdate(state, eventType) {
			const hasData = state.tableData.length > 0;

			if (eventType === 'session_changed') {
				_renderRulesList(state.savedRules);
				_renderCategoryDatalist(state);
				_updateMatchCountAndButtonState();
			}

			DOM.ruleSearch.disabled = !hasData;
			DOM.ruleCategory.disabled = !hasData;
			DOM.ruleFixkostenCheckbox.disabled = !hasData;
			DOM.saveRuleBtn.disabled = !hasData;

			if (eventType === 'session_changed') {
				if (hasData) {
					_initTable(state.tableData);
				} else {
					if (_tableInstance) {
						_tableInstance.destroy();
						_tableInstance = null;
						_tableReadyPromise = null;
					}
					DOM.emptyState.classList.remove('hidden');
				}
			}
		}

		return {
			init: function() {
				if (_isInitialized) return;
				
				DOM.ruleSearch.addEventListener('input', _updateMatchPreviewAndFilter);
				DOM.ruleCategory.addEventListener('input', _updateMatchCountAndButtonState); 

				DOM.saveRuleBtn.addEventListener('click', _handleSaveRule);
				DOM.runAllRulesBtn.addEventListener('click', _handleRunAllRules);
				DOM.deleteAllRulesBtn.addEventListener('click', _handleDeleteAllRules);

				Store.subscribe(_onStoreUpdate);
				_isInitialized = true;
			},
			
			destroy: function() {
				if (_tableInstance) {
					_tableInstance.destroy();
					_tableInstance = null;
				}
				_tableReadyPromise = null; 
				DOM.emptyState.classList.remove('hidden');
			},

			exportCsv: async function() {
				const { tableData } = Store.getState();
				
				if (tableData.length > 0) {
					try {
						const csv = Papa.unparse(tableData, { 
							delimiter: ";" 
						});
						
						const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
						const url = URL.createObjectURL(blob);
						
						const a = document.createElement('a');
						a.href = url;
						a.download = 'Haushaltsbuch_Kategorisiert.csv';
						document.body.appendChild(a);
						a.click();
						
						document.body.removeChild(a);
						URL.revokeObjectURL(url);
						
						Utils.showStatus("msg_csv_exported", 'success', tableData.length);

					} catch (e) {
						console.error("CSV Export failed:", e);
						Utils.showStatus("msg_crit_error", 'error', e.message);
					}
				} else {
					Utils.showStatus("msg_no_data_to_export", 'info');
				}
			}
		};
		
	})();


	/**
	 * @namespace VisualizeModule
	 * @description Verwaltet die Visualisierungs Seite (Chart.js, Datumsfilter, Detail Tabellen).
	 */
	const VisualizeModule = (function() {
		let _myChartInstance = null; 
		let _myOverviewChartInstance = null; 
		let _myLineChartInstance = null; 
		let _myScatterChartInstance = null; 
		
		let _einnahmenTableInstance = null;
		let _variableAusgabenTableInstance = null;

		/**

		function _dateSorter(a, b) {
			const dateA = a ? new Date(a) : null;
			const dateB = b ? new Date(b) : null;
			if (dateA === null && dateB === null) return 0;
			if (dateA === null) return -1; 
			if (dateB === null) return 1;
			return dateA.getTime() - dateB.getTime();
		}
