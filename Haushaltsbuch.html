		function _shiftDates(data) {
			const occurrenceMap = {};

			// zähle Duplikate
			data.forEach(row => {
				if (!row.Fixkosten || !row.Buchungstag) return;
				
				const parts = row.Buchungstag.split('-');
				if (parts.length !== 3) return;
				
				const key = `${parts[0]}-${parts[1]}|${row.Kategorie}|${row.Betrag}`;
				occurrenceMap[key] = (occurrenceMap[key] || 0) + 1;
			});

			return data.map(row => {
				if (!row.Fixkosten) return row;
				if (!row.Buchungstag) return row;

				const parts = row.Buchungstag.split('-');
				if (parts.length !== 3) return row;

				let year = parseInt(parts[0], 10);
				let month = parseInt(parts[1], 10); 
				const day = parseInt(parts[2], 10);

				// Check auf Uniqueness, um False Positives bei gleichen Beträgen zu vermeiden.
				const key = `${parts[0]}-${parts[1]}|${row.Verwendungszweck}|${row.Betrag}`;
				const count = occurrenceMap[key] || 0;
				if (count < 2) return row;

				const lastDayOfMonth = new Date(year, month, 0).getDate();

				// Logik: Wenn die Buchung sehr spät im Monat ist (letzte 2 Tage), schieben in den nächsten Mnat.
				if (day >= lastDayOfMonth - 2) {
					month++;
					
					if (month > 12) {
						month = 1;
						year++;
					}

					const newDateStr = `${year}-${String(month).padStart(2, '0')}-01`;
					
					// console.log(`Debug: Shifted date for '${row.Verwendungszweck}' from ${row.Buchungstag} to ${newDateStr}`);
				
					return {
						...row,
						Buchungstag: newDateStr
					};
				}
				
				return row;
			});
		}

		/* --- Daten Verarbeitung --- */
		
		function _getFilteredData(tableData) {
			const start = DOM.dateStart.value ? new Date(DOM.dateStart.value) : null;
			const end = DOM.dateEnd.value ? new Date(DOM.dateEnd.value) : null;

			if (start) start.setHours(0, 0, 0, 0);
			if (end) end.setHours(23, 59, 59, 999);

			return tableData.filter(row => {
				const rowDate = Utils.parseGermanDate(row.Buchungstag);
				if (!rowDate) return false;
				const isAfterStart = start ? rowDate >= start : true;
				const isBeforeEnd = end ? rowDate <= end : true;
				return isAfterStart && isBeforeEnd;
			});
		}

		function _getCustomChartConfig(filteredData) {
			//  Toggle State
			let customCategories = [];
			let isCustomChart = false;

			if (_actLinMode === 'top') {
				isCustomChart = true;
				
				// Wir müssen die vari Ausgaben zusammenfassen, um die "Top" zu finden
				const variableExpenses = filteredData.filter(row =>
					row.Betrag < 0 && !row.Fixkosten
				);
				const categoryTotals = {};
				
				variableExpenses.forEach(row => {
					const category = (row.Kategorie || '').trim().toLowerCase();
					if (!category) return; 
					const amount = Math.abs(row.Betrag);
					categoryTotals[category] = (categoryTotals[category] || 0) + amount;
				});
				
				// Sortieren und Top Werte nehmen
				customCategories = Object.entries(categoryTotals)
					.sort(([, a], [, b]) => b - a) 
					.slice(0, 5) 
					.map(([category]) => category); 
			}

			// beide leer, nutze  den Standard-View.
			return { customCategories, isCustomChart };
		}
		
		/**
		 * Aggregiert die Rohdaten und berechnet Summen.
		 */
		function _aggregateData(filteredData, customCategories = []) {
	
			if (!filteredData) return null;

			const einnahmenData = [];
			const ausgabenData = [];
			const scatterData = [];
			
			let totalIncome = 0;
			let totalExpenses = 0;
			let totalFixedExpenses = 0;
			let totalVariableExpenses = 0;
			
			const monthlyData = {};
			const customMonthlyData = {};
			const uniqueMonths = new Set();
			
			// Helferset für schnellen Lookup
			const customCategorySet = new Set(customCategories || []);
			const KEY_OTHERS = '_others';
			// const debugOthersMap = {}; // // console.log("Debug map init");

			// Iteriere über die gefilterten Daten
			filteredData.forEach(row => {
				const amount = row.Betrag || 0;
				const tableRow = { ...row }; // Copy row
				const date = Utils.parseGermanDate(row.Buchungstag);
				
				// Split Income -Exp.
				if (amount > 0) {
					einnahmenData.push(tableRow);
					totalIncome += amount;
				} else if (amount < 0) {
					ausgabenData.push(tableRow);
					totalExpenses += amount;
					
					if (row.Fixkosten) {
						totalFixedExpenses += amount;
					} else {
						totalVariableExpenses += amount;
					}

					// Scatter braucht nur Ausgaben und valides Datum
					if (date && !row.Fixkosten) {
						scatterData.push({
							x: date.getTime(),
							y: Math.abs(amount),
							label: row["Verwendungszweck"] || L('tooltip_unknown')
						});
					}
				}
				
				// Monthly Aggre Logic
				if (!date) return; // Skip invalid dates
				
				const monthKey = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
				uniqueMonths.add(monthKey);

				if (!monthlyData[monthKey]) {
					monthlyData[monthKey] = { income: 0, fixed: 0, variable: 0 };
				}
				
				if (amount > 0) {
					monthlyData[monthKey].income += amount;
				} else if (amount < 0) {
					const absAmount = Math.abs(amount);
					if (row.Fixkosten) {
						monthlyData[monthKey].fixed += absAmount;
					} else {
						monthlyData[monthKey].variable += absAmount;
					}
					
					// Handl Top Kategorien
					if (customCategorySet.size > 0) {
						const rowCategory = (row.Kategorie || '').trim().toLowerCase();
						if (!customMonthlyData[monthKey]) customMonthlyData[monthKey] = {};

						if (customCategorySet.has(rowCategory)) {
							// Jay; Top Kategorie
							if (!customMonthlyData[monthKey][rowCategory]) customMonthlyData[monthKey][rowCategory] = 0;
							customMonthlyData[monthKey][rowCategory] += absAmount;
						} else if (!row.Fixkosten && rowCategory !== "") {
							// Sonstige
							if (!customMonthlyData[monthKey][KEY_OTHERS]) customMonthlyData[monthKey][KEY_OTHERS] = 0;
							customMonthlyData[monthKey][KEY_OTHERS] += absAmount;
						}
					}
				}
			});

			const variableAusgabenData = ausgabenData.filter(row => !row.Fixkosten);
			const fixeAusgabenData = ausgabenData.filter(row => !!row.Fixkosten);
			const totalBalance = totalIncome + totalExpenses;

			return {
				einnahmenData,
				variableAusgabenData,
				fixeAusgabenData,
				scatterData,
				monthlyData,
				customMonthlyData,
				uniqueMonths,
				totals: {
					totalIncome,
					totalExpenses,
					totalFixedExpenses,
					totalVariableExpenses,
					totalBalance
				}
			};
		}

		/**
		 * Bereitet die Daten für die Kreisdiagramme vor.
		 */
		function _preparePieData(variableAusgabenData, totals) {
			if (!variableAusgabenData) return { expensePie: {}, overviewPie: {} };

			const categoryTotalsVariableExpenses = {};
			
			variableAusgabenData.forEach(row => {
				const category = row.Kategorie || L("category_placeholder");
				const amount = Math.abs(row.Betrag);
				
				if (!categoryTotalsVariableExpenses[category]) {
					categoryTotalsVariableExpenses[category] = 0;
				}
				categoryTotalsVariableExpenses[category] += amount;
			});

			return {
				expensePie: { 
					categoryTotals: categoryTotalsVariableExpenses 
				},
				overviewPie: { 
					totalIncome: totals.totalIncome, 
					totalFixedExpenses: totals.totalFixedExpenses, 
					totalVariableExpenses: totals.totalVariableExpenses 
				}
			};
		}

		/**
		 * Baut die Datasets für die Liniendiagrammses zusammen.
		 */
		function _prepareLineData(monthlyData, customMonthlyData, customCategories, uniqueMonths) {
			const sortedMonths = Array.from(uniqueMonths).sort();
			
			// Standard LineDiagram
			const incomeData = [];
			const fixedData = [];
			const varData = [];
			const totalMonthlyExpenseData = [];
			const balanceData = [];
			const cumExpenseData = [];
			
			let cumExpense = 0;

			sortedMonths.forEach(k => {
				const mData = monthlyData[k] || { income: 0, fixed: 0, variable: 0 };
				
				const inc = mData.income;
				const fix = mData.fixed;
				const vari = mData.variable;
				
				const totalExp = fix + vari;
				const currentBalance = inc - totalExp;
				
				cumExpense += totalExp;

				// Push to arrays
				incomeData.push(inc);
				fixedData.push(fix);
				varData.push(vari);
				totalMonthlyExpenseData.push(totalExp);
				balanceData.push(currentBalance);
				cumExpenseData.push(cumExpense);
			});

			const lineChartData = { 
				labels: sortedMonths, 
				incomeData, 
				fixedData, 
				varData, 
				cumulativeExpenseData: cumExpenseData, 
				totalMonthlyExpenseData,
				balanceData 
			};
			
			// TopX Line Data bauen
			const customLineChartDatasets = [];
			const KEY_OTHERS = '_others';
			const customCategorySet = new Set(customCategories || []);

			if (customCategories && customCategories.length > 0) {
				customCategories.forEach((category, index) => {
					const data = sortedMonths.map(month => {
						return (customMonthlyData[month] && customMonthlyData[month][category]) 
							? customMonthlyData[month][category] 
							: 0;
					});
			
					const color = DOM.CHART_COLORS[index % DOM.CHART_COLORS.length];
					
					customLineChartDatasets.push({
						label: category, 
						data: data,
						borderColor: color,
						backgroundColor: color, 
						fill: false,
						tension: 0.2
					});
				});

				// Sonstige
				if (customCategorySet.size > 0) {
					const othersData = sortedMonths.map(month => {
						return (customMonthlyData[month] && customMonthlyData[month][KEY_OTHERS]) 
							? customMonthlyData[month][KEY_OTHERS] 
							: 0;
					});
					
					const othersColor = '#CC60FF'; // lila
					const othersBg = 'rgba(153, 102, 255, 0.2)';

					customLineChartDatasets.push({
						label: L('vis_lines_other'), 
						data: othersData,
						borderColor: othersColor,
						backgroundColor: othersBg,
						fill: false,
						tension: 0.2
					});
				}
			}

			return {
				lineChart: lineChartData,
				customLineChart: { 
					labels: sortedMonths, 
					datasets: customLineChartDatasets 
				}
			};
		}

		/**
		 * koordiniert sub Datenverarbeitungs routinen. 
		 */
		function _processData(filteredData, customCategories = []) {
			// console.time("ProcessDataTimer");
			
			const aggResult = _aggregateData(filteredData, customCategories);
			
			if (!aggResult) {
				return { summary: {}, details: {}, expensePie: {}, overviewPie: {}, lineChart: {}, customLineChart: {}, scatterPlot: {} };
			}

			const { 
				einnahmenData, 
				variableAusgabenData, 
				fixeAusgabenData, 
				scatterData, 
				monthlyData, 
				customMonthlyData, 
				uniqueMonths, 
				totals 
			} = aggResult;

			// Pie Charts
			const pieData = _preparePieData(variableAusgabenData, totals);

			//Line Charts
			const lineData = _prepareLineData(monthlyData, customMonthlyData, customCategories, uniqueMonths);
			
			// console.timeEnd("ProcessDataTimer");

			// Zusammenbaun
			return {
				summary: { 
					totalIncome: totals.totalIncome, 
					totalExpenses: totals.totalExpenses, 
					totalBalance: totals.totalBalance 
				},
				details: { 
					einnahmenData, 
					variableAusgabenData, 
					fixeAusgabenData 
				},
				expensePie: pieData.expensePie,
				overviewPie: pieData.overviewPie,
				lineChart: lineData.lineChart,
				customLineChart: lineData.customLineChart,
				scatterPlot: { data: scatterData }
			};
		}

		function _refreshPieSection(processedData, currentCurrency) {
			if (DOM.visPieContentOverview.classList.contains('hidden')) return;

			if (_activeOverviewTab === 'categories') {
				DOM.overviewChartContainer.classList.add('hidden');
				DOM.categoriesChartContainer.classList.remove('hidden');
				
				if (_myOverviewChartInstance) {
					_myOverviewChartInstance.destroy();
					_myOverviewChartInstance = null;
				}
				_updateCategoriesPieChart(processedData.expensePie, currentCurrency);
			} else {
				DOM.overviewChartContainer.classList.remove('hidden');
				DOM.categoriesChartContainer.classList.add('hidden');
				
				if (_myChartInstance) {
					_myChartInstance.destroy();
					_myChartInstance = null;
				}
				_updateOverviewPieChart(processedData.overviewPie, currentCurrency);
			}
		}

		function _refreshLineSection(processedData, currentCurrency, isCustomChart) {
			if (DOM.visContentLines.classList.contains('hidden')) return;

			if (isCustomChart) {
				_updateLineChart(processedData.customLineChart, currentCurrency, true);
			} else {
				_updateLineChart(processedData.lineChart, currentCurrency, false); 
			}
		}

		function _refreshScatterSection(processedData, currentCurrency) {
			if (DOM.visContentScatter.classList.contains('hidden')) return;
			_updateScatterPlot(processedData.scatterPlot, currentCurrency);
		}

		async function _refreshDetailTables() {
			if (DOM.visContentDetails.classList.contains('hidden')) return;

			if (_activeDetailTab === 'einnahmen') {
				await _updateEinnahmenTable(_cachedDetailData.einnahmenData);
			} else if (_activeDetailTab === 'variable') {
				await _updateVariableAusgabenTable(_cachedDetailData.variableAusgabenData);
			} else if (_activeDetailTab === 'fixe') {
				await _updateFixeAusgabenTable(_cachedDetailData.fixeAusgabenData);
			}
		}

		async function updateChart() {
			const { tableData, currentCurrency } = Store.getState();
			
			if (tableData.length === 0) {
				_handleEmptyData();
				return;
			}

			let workingData = tableData;
			if (DOM.dateShiftCheckbox && DOM.dateShiftCheckbox.checked) {
				workingData = _shiftDates(tableData);
			}

			const filteredData = _getFilteredData(workingData);
			const { customCategories, isCustomChart } = _getCustomChartConfig(filteredData);
			
			const processedData = _processData(filteredData, customCategories);
			
			_cachedDetailData = processedData.details;

			_updateSummaryUI(processedData.summary, currentCurrency);
			_refreshPieSection(processedData, currentCurrency);
			_refreshLineSection(processedData, currentCurrency, isCustomChart);
			_refreshScatterSection(processedData, currentCurrency);
			
			await _refreshDetailTables();
		} 
		
		function _updateSummaryUI(summary, currentCurrency) {
			const { totalIncome, totalExpenses, totalBalance } = summary;
			const currencyFormatter = (value) => `${value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currentCurrency}`;
			
			DOM.totalIncome.textContent = currencyFormatter(totalIncome);
			DOM.totalExpenses.textContent = currencyFormatter(Math.abs(totalExpenses));
			DOM.totalBalance.textContent = currencyFormatter(totalBalance);

			DOM.totalBalance.classList.remove('text-green-600', 'text-red-600', 'text-gray-800');
			if (totalBalance > 0.01) DOM.totalBalance.classList.add('text-green-600');
			else if (totalBalance < -0.01) DOM.totalBalance.classList.add('text-red-600');
			else DOM.totalBalance.classList.add('text-gray-800');
			
			DOM.summaryDisplay.classList.remove('hidden');
		}

		function _updateOverviewPieChart(overviewPieData, currentCurrency) {
			const { totalIncome, totalFixedExpenses, totalVariableExpenses } = overviewPieData;
			const labelsOverview = [L('vis_summary_income'), L('vis_nested_fixed'), L('vis_nested_variable')];
			const dataOverview = [totalIncome, Math.abs(totalFixedExpenses), Math.abs(totalVariableExpenses)];

			if (totalIncome === 0 && totalFixedExpenses === 0 && totalVariableExpenses === 0) {
				DOM.chartEmptyStateOverview.classList.remove('hidden');
				DOM.overviewChart.classList.add('hidden');
				if (_myOverviewChartInstance) _myOverviewChartInstance.destroy();
				_myOverviewChartInstance = null;
			} else {
				DOM.chartEmptyStateOverview.classList.add('hidden');
				DOM.overviewChart.classList.remove('hidden');

				if (_myOverviewChartInstance) { 
					_myOverviewChartInstance.data.labels = labelsOverview;
					_myOverviewChartInstance.data.datasets[0].data = dataOverview;
					_myOverviewChartInstance.options.plugins.title.text = L('vis_nested_pie_overview');
					_myOverviewChartInstance.update();
				} else { 
					const ctxOverview = DOM.overviewChart.getContext('2d');
					_myOverviewChartInstance = new Chart(ctxOverview, {
						type: 'pie',
						data: {
							labels: labelsOverview,
							datasets: [{
								label: L('vis_summary_balance'),
								data: dataOverview,
								backgroundColor: [ DOM.OVERVIEW_CHART_COLORS.INCOME, DOM.CHART_COLORS[4], DOM.CHART_COLORS[0] ],
								borderColor: '#fff',
								borderWidth: 1
							}]
						},
						options: {
							responsive: true,
							maintainAspectRatio: false,
							plugins: {
								legend: { position: 'top' },
								title: { display: true, text: L('vis_nested_pie_overview') },
								tooltip: {
									callbacks: {
										label: function(context) {
											let label = context.label || '';
											let value = context.raw || 0;
											let sum = context.chart.getDatasetMeta(0).total;
											let percentage = sum > 0 ? (value * 100 / sum).toFixed(2) + '%' : '0.00%';
											return `${label}: ${value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currentCurrency} (${percentage})`;
										}
									}
								}
							}
						}
					});
				}
			}
		}
		
		function _updateCategoriesPieChart(expensePieData, currentCurrency) {
			const labelsExpenses = Object.keys(expensePieData.categoryTotals);
			const dataExpenses = Object.values(expensePieData.categoryTotals);
			const title = L('vis_nested_variable');

			if (labelsExpenses.length === 0) {
				DOM.chartEmptyState.classList.remove('hidden');
				DOM.categoriesChart.classList.add('hidden');
				if (_myChartInstance) _myChartInstance.destroy();
				_myChartInstance = null;
			} else {
				DOM.chartEmptyState.classList.add('hidden');
				DOM.categoriesChart.classList.remove('hidden');

				if (_myChartInstance) { 
					_myChartInstance.data.labels = labelsExpenses;
					_myChartInstance.data.datasets[0].data = dataExpenses;
					_myChartInstance.data.datasets[0].label = L('vis_summary_expenses');
					_myChartInstance.options.plugins.title.text = title;
					_myChartInstance.update();
				} else { 
					const ctx = DOM.categoriesChart.getContext('2d');
					_myChartInstance = new Chart(ctx, {
						type: 'pie',
						data: {
							labels: labelsExpenses,
							datasets: [{
								label: L('vis_summary_expenses'),
								data: dataExpenses,
								backgroundColor: DOM.CHART_COLORS,
								borderColor: '#fff',
								borderWidth: 1
							}]
						},
						options: {
							responsive: true,
							maintainAspectRatio: false,
							plugins: {
								legend: { position: 'top', labels: { boxWidth: 8, boxHeight: 8, padding: 3 } },
								title: { display: true, text: title },
								tooltip: {
									callbacks: {
										label: function(context) {
											let label = context.label || '';
											let value = context.raw || 0;
											let sum = context.chart.getDatasetMeta(0).total;
											let percentage = (value * 100 / sum).toFixed(2) + '%';
											return `${label}: ${value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currentCurrency} (${percentage})`;
										}
									}
								}
							}
						}
					});
				}
			}
		}

		function _updateLineChart(lineChartData, currentCurrency, isCustom = false) {
			let labels, datasets;
			let title = L('vis_tab_lines');

			if (isCustom) {
				// Custom view fuer Top Kategorien
				labels = lineChartData.labels;
				datasets = lineChartData.datasets;
				title = 'Kategorien'; 
			} else {
				// hole Daten 
				const { 
					labels: lineChartLabels, 
					incomeData, 
					fixedData, 
					varData,               
					totalMonthlyExpenseData, 
					balanceData   
				} = lineChartData;
				
				// console.log("Debug: varData length: ", varData?.length);

				labels = lineChartLabels;
				datasets = [
					{ // Einnahmen
						label: L('vis_summary_income'), 
						data: incomeData, 
						borderColor: DOM.OVERVIEW_CHART_COLORS.INCOME, 
						backgroundColor: 'rgba(16, 185, 129, 0.2)', 
						fill: true, 
						tension: 0.2, 
						yAxisID: 'y' 
					},
					{ // variable Ausgaben
						label: L('vis_nested_variable'), 
						data: varData,
						borderColor: DOM.CHART_COLORS[0], 
						backgroundColor: 'rgba(255, 99, 132, 0.2)', 
						fill: true, 
						tension: 0.2, 
						yAxisID: 'y' 
					},
					{ // fixe
						label: L('vis_nested_fixed'), 
						data: fixedData, 
						borderColor: DOM.CHART_COLORS[4], 
						backgroundColor: 'rgba(153, 102, 255, 0.2)', 
						fill: true, 
						tension: 0.2, 
						yAxisID: 'y' 
					},
					{ // beide Ausgaben
						label: L('vis_summary_expenses'),
						data: totalMonthlyExpenseData,
						borderColor: '#F59E0B', 
						backgroundColor: 'rgba(245, 158, 11, 0.1)', 
						fill: false,
						tension: 0.1,
						yAxisID: 'y' 
					},
					// Saldo Linienchart
					{
						label: L('vis_summary_balance'),
						data: balanceData, // Und hier balanceData
						borderColor: '#37A151', 
						backgroundColor: 'rgba(55, 65, 81, 0.1)',
						fill: false,
						borderWidth: 2,
						//borderDash: [5, 5], // Gestrichelt damits distinct aussieht
						tension: 0.1,
						yAxisID: 'y'
					}
				];
			}

			// keine Daten - Fehler ausgeben
			if (labels.length === 0 || (isCustom && datasets.length === 0)) {
				DOM.chartEmptyStateLines.classList.remove('hidden');
				DOM.lineChartCanvas.classList.add('hidden');
				
				DOM.chartEmptyStateLines.querySelector('p').textContent = isCustom ? 'Keine Daten für gewählte Kategorien' : L('vis_chart_lines_empty');
				DOM.chartEmptyStateLines.querySelector('.text-sm').textContent = isCustom ? 'Bitte Eingabe prüfen oder Zeitraum ändern.' : 'Bitte Zeitraum prüfen.';

				if (_myLineChartInstance) _myLineChartInstance.destroy();
				_myLineChartInstance = null;
			} else {
				// Chart area anzeigen
				DOM.chartEmptyStateLines.classList.add('hidden');
				DOM.lineChartCanvas.classList.remove('hidden');

				if (_myLineChartInstance) { 
					// Update existing Chart
					_myLineChartInstance.data.labels = labels;
					_myLineChartInstance.data.datasets = datasets;
					_myLineChartInstance.options.plugins.title.text = title;
					_myLineChartInstance.options.plugins.legend.labels.font.size = isCustom ? 10 : 12;
					_myLineChartInstance.options.scales.y.title.text = L('Betrag') + ` (${currentCurrency})`;
					_myLineChartInstance.update();
				} else { 
					// New Chart erstellen
					const ctxLine = DOM.lineChartCanvas.getContext('2d');
					_myLineChartInstance = new Chart(ctxLine, {
						type: 'line',
						data: { labels: labels, datasets: datasets },
						options: {
							responsive: true,
							maintainAspectRatio: false,
							plugins: {
								title: { display: true, text: title },
								legend: { labels: { font: { size: isCustom ? 10 : 12 }, boxWidth: 8, boxHeight: 8 } },
								tooltip: {
									mode: 'index',
									intersect: false,
									callbacks: {
										label: function(context) {
											let label = context.dataset.label || '';
											let value = context.parsed.y || 0;
											return `${label}: ${value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currentCurrency}`;
										}
									}
								}
							},
							scales: {
								y: {
									beginAtZero: true,
									title: { display: true, text: L('Betrag') + ` (${currentCurrency})` },
									ticks: { callback: function(value) { return value.toLocaleString('de-DE', { maximumFractionDigits: 0 }); } }
								},
								x: { title: { display: true, text: L('Monat') } }
							}
						}
					});
				}
			}
		}
		
		function _updateScatterPlot(scatterPlotData, currentCurrency) {
			const data = scatterPlotData.data;
			const title = L('vis_scatter_title'); 

			if (data.length === 0) {
				DOM.chartEmptyStateScatter.classList.remove('hidden');
				const pTitle = DOM.chartEmptyStateScatter.querySelector('p.text-xl') || DOM.chartEmptyStateScatter.querySelector('p');
				if (pTitle) pTitle.textContent = L('vis_scatter_empty'); 
				const pSub = DOM.chartEmptyStateScatter.querySelector('p.text-sm');
				if (pSub) pSub.textContent = L('vis_scatter_empty_sub');

				DOM.scatterChartCanvas.classList.add('hidden');
				if (_myScatterChartInstance) _myScatterChartInstance.destroy();
				_myScatterChartInstance = null;
			} else {
				DOM.chartEmptyStateScatter.classList.add('hidden');
				DOM.scatterChartCanvas.classList.remove('hidden');

				if (_myScatterChartInstance) { 
					_myScatterChartInstance.data.datasets[0].data = data;
					_myScatterChartInstance.options.plugins.title.text = title; 
					_myScatterChartInstance.options.scales.y.title.text = L('Betrag') + ` (${currentCurrency})`;
					_myScatterChartInstance.update();
				} else { 
					const ctxScatter = DOM.scatterChartCanvas.getContext('2d');
					_myScatterChartInstance = new Chart(ctxScatter, {
						type: 'scatter',
						data: {
							datasets: [{
								label: L('vis_summary_expenses'),
								data: data,
								backgroundColor: 'rgba(255, 99, 132, 0.7)', 
								borderColor: 'rgba(255, 99, 132, 1)',
								borderWidth: 1,
								pointRadius: 5,
								pointHoverRadius: 8
							}]
						},
						options: {
							responsive: true,
							maintainAspectRatio: false,
							plugins: {
								legend: { display: false }, 
								title: { display: true, text: title },
								tooltip: {
									callbacks: {
										label: function(context) {
											const raw = context.raw;
											const date = new Date(raw.x);
											const dateString = date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
											const purpose = raw.label || L('tooltip_unknown'); 
											const value = raw.y || 0;
											const valueString = `${value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currentCurrency}`;
											return `${dateString} - ${valueString} (${purpose})`;
										}
									}
								}
							},
							scales: {
								x: {
									type: 'linear', 
									title: { display: true, text: L('Buchungstag') },
									ticks: {
										callback: function(value) {
											return new Date(value).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
										}
									}
								},
								y: {
									beginAtZero: true,
									title: { display: true, text: L('Betrag') + ` (${currentCurrency})` }
								}
							}
						}
					});
				}
			}
		}

		
		function _handleEmptyData() {
			_destroyCharts();
			_destroyDetailTables();
			DOM.summaryDisplay.classList.add('hidden');
		}

		return {
			init: function() {
				if (_isInitialized) return;
				
				DOM.dateStart.addEventListener('change', updateChart);
				DOM.dateEnd.addEventListener('change', updateChart);
				DOM.dateShiftCheckbox.addEventListener('change', updateChart);
				DOM.visLinesAllBtn.addEventListener('click', () => _handLinTog('all'));
				DOM.visLinesTopBtn.addEventListener('click', () => _handLinTog('top'));

				DOM.visPieTabOverview.addEventListener('click', () => showTab('overview'));
				DOM.visTabDetails.addEventListener('click', () => showTab('details'));
				DOM.visTabLines.addEventListener('click', () => showTab('lines'));
				DOM.visTabScatter.addEventListener('click', () => showTab('scatter')); 
				
				DOM.visOverviewToggleBtn.addEventListener('click', () => _handleOverviewToggle('overview'));
				DOM.visCategoriesToggleBtn.addEventListener('click', () => _handleOverviewToggle('categories'));

				DOM.visTabEinnahmen.addEventListener('click', () => _handleNestedTabClick('einnahmen'));
				DOM.visTabVariableAusgaben.addEventListener('click', () => _handleNestedTabClick('variable'));
				DOM.visTabFixeAusgaben.addEventListener('click', () => _handleNestedTabClick('fixe'));
				
				Store.subscribe((state, eventType) => {
					if (eventType === 'session_changed' || eventType === 'data_changed') {
						if (DOM.dateStart.value === '' && state.tableData.length > 0) {
							_setDateFiltersFromData(state.tableData);
						}
						updateChart();
					}
				});
				_isInitialized = true;
			},
			
			destroy: function() {
				_destroyCharts();
				_destroyDetailTables(); 
				
				const currencyFormatter = (value) => `${value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${DOM.DEFAULT_CURRENCY}`;
				DOM.totalIncome.textContent = currencyFormatter(0);
				DOM.totalExpenses.textContent = currencyFormatter(0);
				DOM.totalBalance.textContent = currencyFormatter(0);
				DOM.totalBalance.className = 'text-2xl font-bold text-gray-800';
				DOM.summaryDisplay.classList.add('hidden');
				
				DOM.dateStart.value = '';
				DOM.dateEnd.value = '';
				
				// State Reset für die Line Buttons
				_actLinMode = 'all';
				_updLinTogBtns();
			},
			
			update: updateChart,
			showTab: showTab
		};
	})();

	/**
	 * @namespace MainController
	 * @description Haupt Controller (Router). Verwaltet die Seitennavigation
	 * und globale Aktionen (Reset, Export, Save JSON).
	 */
	const MainController = (function() {
		function showPage(pageName) {
			DOM.pageHome.classList.add('hidden');
			DOM.pageImport.classList.add('hidden');
			DOM.pageLoadJson.classList.add('hidden');
			DOM.pageCategorize.classList.add('hidden');
			DOM.pageVisualize.classList.add('hidden');
			
			const { BASE, ACTIVE, INACTIVE, DISABLED } = DOM.NAV_STYLES;
			
			DOM.navHomeBtn.className = `${BASE} ${INACTIVE} flex items-center gap-2`;
			
			const { tableData } = Store.getState();
			const dataLoaded = tableData.length > 0;
			
			DOM.navImportBtn.className = `${BASE} ${INACTIVE}`;
			DOM.navImportBtn.disabled = false;
			
			DOM.navCategorizeBtn.className = `${BASE} ${dataLoaded ? INACTIVE : DISABLED}`;
			DOM.navCategorizeBtn.disabled = !dataLoaded;
			
			DOM.navVisualizeBtn.className = `${BASE} ${dataLoaded ? INACTIVE : DISABLED}`;
			DOM.navVisualizeBtn.disabled = !dataLoaded;

			if (pageName === 'home') {
				DOM.pageHome.classList.remove('hidden');
				DOM.headerActions.classList.add('hidden');

			} else if (pageName === 'import') {
				DOM.pageImport.classList.remove('hidden');
				DOM.navImportBtn.className = `${BASE} ${ACTIVE}`;
				DOM.headerNav.classList.remove('hidden');
				DOM.headerActions.classList.remove('hidden');
				
				DOM.importMappingStep.classList.add('hidden');
				DOM.importInitialStep.classList.remove('hidden');

			} else if (pageName === 'loadJson') {
				DOM.pageLoadJson.classList.remove('hidden');
				DOM.navImportBtn.className = `${BASE} ${ACTIVE}`;
				DOM.headerNav.classList.remove('hidden');
				DOM.headerActions.classList.remove('hidden');

			} else if (pageName === 'categorize' && dataLoaded) {
				DOM.pageCategorize.classList.remove('hidden');
				DOM.navCategorizeBtn.className = `${BASE} ${ACTIVE}`;
				DOM.headerNav.classList.remove('hidden');
				DOM.headerActions.classList.remove('hidden');

			} else if (pageName === 'visualize' && dataLoaded) {
				DOM.pageVisualize.classList.remove('hidden');
				DOM.navVisualizeBtn.className = `${BASE} ${ACTIVE}`;
				DOM.headerNav.classList.remove('hidden');
				DOM.headerActions.classList.remove('hidden');
				
				VisualizeModule.showTab('overview');
				
				_resetNestedTabToEinnahmen();
				
			} else {
				DOM.pageHome.classList.remove('hidden');
				DOM.headerActions.classList.add('hidden');
				DOM.headerNav.classList.add('hidden');
			}
			
			DOM.resetBtn.classList.toggle('hidden', pageName === 'home');
			DOM.exportBtn.classList.toggle('hidden', !dataLoaded || pageName === 'home');
			DOM.saveJsonBtn.classList.toggle('hidden', !dataLoaded || pageName === 'home');
		}
		
		function _resetNestedTabToEinnahmen() {
			DOM.visContentEinnahmen.classList.remove('hidden');
			DOM.visContentVariableAusgaben.classList.add('hidden');
			DOM.visContentFixeAusgaben.classList.add('hidden');
			DOM.visTabEinnahmen.classList.add('active');
			DOM.visTabVariableAusgaben.classList.remove('active');
			DOM.visTabFixeAusgaben.classList.remove('active');
		}


		async function _handleReset() {
			const isConfirmed = await Utils.showConfirmationModal(
				"confirm_reset_title",
				"confirm_reset_message",
				"confirm_reset_btn"
			);
			
			if (isConfirmed) {
				Store.reset();
				CategorizeModule.destroy();
				VisualizeModule.destroy();
				
				DOM.ruleSearch.disabled = true;
				DOM.ruleCategory.disabled = true;
				DOM.ruleCategory.value = '';
				
				DOM.ruleFixkostenCheckbox.disabled = true;
				DOM.ruleFixkostenCheckbox.checked = false;
				
				Utils.showStatus("msg_session_reset", 'info');
				showPage('home');
			}
		}
		
		function _handleSaveJson() {
			const { tableData, savedRules, currentCurrency } = Store.getState();

			if (tableData.length === 0 && savedRules.length === 0) {
				Utils.showStatus("msg_no_data_to_save", 'info');
				return;
			}
			
			const dataToSave = {
				currency: currentCurrency, 
				rules: savedRules,
				data: tableData
			};
			
			const jsonString = JSON.stringify(dataToSave, null, 2);
			const blob = new Blob([jsonString], { type: 'application/json' });
			const url = URL.createObjectURL(blob);
			
			const a = document.createElement('a');
			a.href = url;
			a.download = 'Haushaltsbuch_Daten.json';
			document.body.appendChild(a);
			a.click();
			
			document.body.removeChild(a);
			URL.revokeObjectURL(url);
			
			Utils.showStatus("msg_json_saved", 'success');
		}
		
		function _handleInfoClick() {
			const lnkHtml = "<br><br><a href='mailto:arjunae@nurfuerspam.de' class='underline'>arjunae@nurfuerspam.de</a><br><a href='https://github.com/Thorsten7701/Haushaltsbuch' target='_blank' class='underline'>github.com/Thorsten7701/Haushaltsbuch</a>";
			Utils.showConfirmationModal(
				"info_modal_title",
				"info_modal_message",
				"modal_btn_close", 
				[lnkHtml],
				true 
			);
		}

		return {
			init: function() {
				DOM.navHomeBtn.addEventListener('click', () => showPage('home'));
				DOM.navImportBtn.addEventListener('click', () => showPage('import'));
				DOM.navCategorizeBtn.addEventListener('click', () => showPage('categorize'));
				DOM.navVisualizeBtn.addEventListener('click', () => showPage('visualize'));

				DOM.resetBtn.addEventListener('click', _handleReset);
				DOM.exportBtn.addEventListener('click', () => CategorizeModule.exportCsv());
				DOM.saveJsonBtn.addEventListener('click', _handleSaveJson);
				
				if (DOM.infoBtn) { 
					DOM.infoBtn.addEventListener('click', _handleInfoClick);
				}
			},
			
			showPage: showPage
		};
	})();

	window.addEventListener('DOMContentLoaded', () => {
		Utils.updateTexts();
		
		ImportModule.init();
		CategorizeModule.init();
		VisualizeModule.init();
		MainController.init();
		MainController.showPage('home');
		IconLoader.run(document);
	}); 

	</script>
	</body>
</html>
