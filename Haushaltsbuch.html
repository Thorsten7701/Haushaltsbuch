<meta charset="UTF-8">

	<link rel="stylesheet" href="lib/tabulator.css">
	<script type="text/javascript" src="lib/iconloader.js"></script>
	<script type="text/javascript" src="lib/papaparse.js"></script>
	<script type="text/javascript" src="lib/tabulator.js"></script>
	<script type="text/javascript" src="lib/tailwind.js"></script>
	<script type="text/javascript" src="lib/chart.js"></script>
	<style>
		:root {
			--color-scheme: #10ABA2;
			--color-scheme-hover: #069595;
		}
		html {
			font-size: 90%; 
		}
		/* bessere Integration in Tailwind */
		.tabulator {
			border: none;
			background-color: rgb(249 250 251); // bg-gray-50
			height: 100%;
		}
		.tabulator .tabulator-header {
			border-bottom: 1px solid rgb(229 231 235);
			background-color: rgb(241 243 245);
			font-size: 0.8rem;
			font-weight: 500;
		}
		.tabulator .tabulator-row {
			border-bottom: 1px solid rgb(229 231 235);
			background-color: white;
		}
		.tabulator .tabulator-row:hover {
			background-color: rgb(241 243 245) !important;
		}
		.tabulator .tabulator-cell {
			padding: 4px 6px; 
			font-size: 0.85rem;
			border-right: 1px solid rgb(229 231 235); // Hellgraue Spalten Trennlinie
		}
		// Fix für Tick/Cross Editor
		.tabulator-cell[tabulator-field="Fixkosten"] {
			cursor: pointer;
		}
		
		// CSV Spaltenzuordnung
		#mappingInstruction span {
			margin: 0 4px;
			padding: 2px 6px;
			border-radius: 4px;
			font-weight: 500;
			transition: all 0.3s ease;
		}
		#mappingInstruction span.mapped {
			background-color: #d1fae5; /* green-100 */
			color: #065f46; /* green-800 */
			text-decoration: line-through;
		}
		#mappingInstruction span.current {
			background-color: #dbeafe; /* blue-100 */
			color: #1d4ed8; /* blue-700 */
			font-weight: 700;
			box-shadow: 0 0 0 2px #bfdbfe;
		}
		#previewMappingTable th {
			padding: 8px 12px;
			background-color: #f3f4f6; /* gray-200 */
			border: 1px solid #d1d5db;
			cursor: pointer;
			transition: background-color 0.2s;
		}
		#previewMappingTable th:hover {
			background-color: #e5e7eb; /* gray-300 */
		}
		#previewMappingTable th.mapped-header {
			background-color: #d1d5db; /* gray-400 */
			color: #6b7280; /* gray-500 */
			cursor: not-allowed;
			text-decoration: line-through;
		}
		#previewMappingTable td {
			border: 1px solid #e5e7eb;
			padding: 6px 10px;
			font-size: 0.9rem;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			max-width: 200px;
		}
		
		/* Visualisierung -> NavLeiste */ 
		.tab-btn {
			padding: 0.55rem 0.55rem;
			font-size: 0.9rem;
			font-weight: 500;
			color: #6b7280; /* text-gray-500 */
			border-bottom: 2px solid transparent;
			transition: all 0.2s;
			cursor: pointer;
		}
		.tab-btn:hover {
			background-color: #f9fafb; /* bg-gray-50 */
			color: #1f2937; /* text-gray-800 */
		}
		.tab-btn.active {
			color: var(--color-scheme); /* text-blue-600 */
			border-bottom-color: var(--color-scheme); /* border-blue-600 */
		}
		
		/* Visualisierung -> DetailsNav */
		.details-tab-btn {
			padding: 0.5rem 1rem;
			font-size: 0.85rem;
			font-weight: 500;
			color: #4b5563; /* text-gray-600 */
			border-bottom: 2px solid transparent;
			cursor: pointer;
		}
		.details-tab-btn:hover {
			background-color: #f3f4f6; /* bg-gray-200 */
		}
		.details-tab-btn.active {
			font-weight: 700;
			color: #1f2937; /* text-gray-800 */
			background-color: #fff;
			border-top: 1px solid #d1d5db;
			border-left: 1px solid #d1d5db;
			border-right: 1px solid #d1d5db;
			border-bottom: 1px solid #fff; /* Verdeckt die untere Kante */
			border-radius: 0.375rem 0.375rem 0 0;
			position: relative;
			top: 1px; /* Rückt den Tab nach oben */
		}
				
		#visDate select {
			cursor: pointer;
		}
		
		.text-3xs { font-size: 0.5rem; } /* 8px */
		.text-2xs { font-size: 0.625rem; } /* 10px */
		
		/* Explorer Vorschau Fenster */
		body.is-loading #appCont {
			display: none !important;
		}
	</style>
</head>

<body class="bg-gray-100 text-gray-800 h-screen flex flex-col font-sans is-loading">
<noscript>
    <div style="padding: 20px; background: #fee; color: #911; border: 1px solid #911;">
        Bitte öffnen sie diese Anwendung in einem &gtES2022 fähigen Browser.

</noscript>

<div id="appCont" class="h-screen flex flex-col">

			</h1>
		<nav id="headerNav" class="hidden flex gap-2">
			<button id="navHomeBtn" data-i18n="nav_home" class="px-3 py-1 rounded text-sm transition-colors duration-200 flex items-center gap-2 text-gray-500 hover:bg-gray-100"><i class="fas fa-home"></i></button>
			<button id="navImportBtn" data-i18n="nav_import" class="px-3 py-1 rounded text-sm transition-colors duration-200"></button>
			<button id="navCategorizeBtn" data-i18n="nav_categorize" class="px-3 py-1 rounded text-sm transition-colors duration-200"></button>
			<button id="navVisualizeBtn" data-i18n="nav_visualize" class="px-3 py-1 rounded text-sm transition-colors duration-200"></button>

			<i class="fas fa-trash"></i>	</button>
			 <button id="saveJsonBtn"  data-i18n="btn_save_json"  class="hidden flex items-center gap-2 bg-[var(--color-scheme)] hover:bg-[var(--color-scheme-hover)] text-white px-3 py-1 rounded transition-colors duration-200">

		</div>
	</header>
	<div id="statusBar" class="hidden bg-blue-50 p-2 text-sm text-blue-800 text-center border-b border-blue-100">
		</div>
	<main id="pageHome" class="flex-1 flex flex-col items-center justify-center p-6">
		<div class="bg-white p-5 rounded-lg shadow-xl text-center w-full max-w-xl"> 
			<i class="fas fa-person text-8xl text-[var(--color-scheme)] mb-8"></i>

			<p class="text-gray-600 mb-5 text-lg" data-i18n="home_welcome_text"></p>
			
			<div class="flex flex-col md:flex-row gap-6">
				<button id="startNewBtn" class="flex-1 flex flex-col items-center gap-4 bg-blue-50 hover:bg-blue-100 text-blue-700 p-6 rounded-lg transition-colors duration-200 border border-blue-200 shadow-sm">

					<span class="text-xl font-semibold" data-i18n="home_btn_new"></span>
					<span class="text-sm text-gray-600" data-i18n="home_btn_new_desc"></span>
				</button>
				
				<button id="loadSessionBtn" class="flex-1 flex flex-col items-center gap-4 bg-gray-50 hover:bg-gray-100 text-gray-700 p-6 rounded-lg transition-colors duration-200 border border-gray-200 shadow-sm">

					<span class="text-xl font-semibold" data-i18n="home_btn_load"></span>
					<span class="text-sm text-gray-600" data-i18n="home_btn_load_desc"></span>
				</button>
			</div>
			
			<div class="bg-white pt-3 rounded-lg text-center w-full max-w-xl"> 
				<span>b45, by Thorsten 2025</span>
				<button id="infoBtn" class="px-2 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors duration-200 text-xs font-medium" data-i18n="home_btn_info"></button>  
			</div>
		</div>
	</main>

	<main id="pageImport" class="hidden flex-1 flex flex-col items-center justify-center p-6">
		<div id="importInitialStep" class="bg-white p-6 rounded-lg shadow-xl text-center max-w-lg w-full">
			<i class="fas fa-file-import text-6xl text-[var(--color-scheme)] mb-6"></i>

			<p class="text-gray-600 mb-8" data-i18n="import_desc"></p>
			<div class="flex items-center justify-center gap-6 mb-6">
				<div class="flex items-center gap-2">
					<label for="delimiterInput" class="text-gray-600 font-medium" data-i18n="label_delimiter"></label>
					<input type="text" id="delimiterInput" value=";" maxlength="1" class="w-12 p-2 border rounded outline-none text-center font-mono" title="CSV Trennzeichen" />
				</div>
				</div>

			<label class="w-full flex items-center justify-center gap-2 bg-[var(--color-scheme)] hover:bg-[var(--color-scheme-hover)] text-white px-6 py-3 rounded-lg cursor-pointer transition-colors duration-200 text-lg font-medium">
				<i class="fas fa-upload"></i>
				<span data-i18n="btn_import_csv"></span>
				<input type="file" id="csvInput" accept=".csv" class="hidden" />
			</label>
		</div>

		<div id="importMappingStep" class="hidden bg-white p-6 rounded-lg shadow-xl max-w-4xl w-full">
			<h2 class="text-2xl font-semibold mb-4 text-center" data-i18n="mapping_title"></h2>
			<p id="mappingInstruction" class="text-gray-700 text-center mb-6 p-4 bg-gray-50 rounded border">
				</p>
				
			<div class="overflow-x-auto border rounded-lg">
				<table id="previewMappingTable" class="w-full min-w-full text-left table-auto">
					<thead id="previewMappingTableHead">
						</thead>
					<tbody id="previewMappingTableBody">
						</tbody>
				</table>
			</div>
			
			<button id="cancelMappingBtn" class="mt-6 w-full bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded transition-colors duration-200" data-i18n="mapping_btn_cancel">
			</button>
		</div>

	</main>

	<main id="pageLoadJson" class="hidden flex-1 flex flex-col items-center justify-center p-6">
		<div class="bg-white p-6 rounded-lg shadow-xl text-center max-w-lg w-full">

			</div>

			<label class="w-full flex items-center justify-center gap-2 bg-[var(--color-scheme)] hover:bg-[var(--color-scheme-hover)] text-white px-6 py-3 rounded-lg cursor-pointer transition-colors duration-200 text-lg font-medium">
				<i class="fas fa-upload"></i>
				<span data-i18n="btn_load_json"></span>
				<input type="file" id="jsonInput" accept=".json" class="hidden" />
			</label>
		</div>
	</main>

	<main id="pageCategorize" class="hidden flex-1 flex flex-col overflow-hidden p-4 ">
		
		<section class="flex-1 flex flex-col overflow-hidden mb-4">
			 <div id="table-container" class="flex-1 bg-white rounded shadow overflow-hidden relative">
				 <div id="emptyState" class="hidden absolute inset-0 flex flex-col items-center justify-center text-gray-400">
					 <i class="fas fa-table text-6xl mb-4 opacity-20"></i>
					 <p class="text-xl" data-i18n="categorize_table_empty"></p>
					 <p class="text-sm" data-i18n="categorize_table_empty_sub"></p>
				 </div>
				 <div id="data-table"></div>
			 </div>
		</section>

		<section class="flex gap-4 h-[310px]">
			
			<div class="w-1/3 max-w-lg bg-white flex flex-col overflow-hidden rounded-lg shadow">
				<div class="p-4 bg-gray-50">
					<h2 id="rulesTitle" data-i18n="rules_title" class="font-semibold text-lg mb-4"> <i class="fas fa-filter"></i>
						</h2>
					
					<div class="bg-white p-3 rounded shadow-sm space-y-3">

						</div>
					</div>

						<div class="flex gap-2">

					</ul>

			</div>

			<div class="flex items-center flex-1">
				
				<button id="visTabPie" class="tab-btn active flex items-center gap-2">
					<i class="fas fa-chart-pie text-[var(--color-scheme)]"></i><span data-i18n="vis_tab_pie">Torte</span>
				</button>
				<button id="visTabLines" class="tab-btn flex items-center gap-2">
					<i class="fas fa-chart-line text-green-500"></i><span data-i18n="vis_tab_lines">Liniendiagramm</span>

				<button id="visTabScatter" class="tab-btn flex items-center gap-2">

				<button id="visTabDetails" class="tab-btn flex items-center gap-2">
					<i class="fas fa-list-ul"></i><span data-i18n="vis_tab_details"></span>

			</div>

							<p class="text-xl" data-i18n="vis_chart_overview_empty">Keine Daten für Übersicht</p>
						</div>
						<div class="relative flex-1 flex flex-col items-center justify-center min-h-0">

					</div>

							<p class="text-sm" data-i18n="vis_chart_empty_sub"></p>

							<div class="relative h-[49vh] w-[80vh]">

					</div>
					
					<div id="summaryDisplay" class="hidden mt-8 pt-6 border-t border-gray-200 w-full max-w-2xl flex justify-around mx-auto">

							<h3 class="text-sm font-medium text-gray-500 uppercase tracking-wide" data-i18n="vis_summary_income"></h3>
							<p id="totalIncome" class="text-2xl font-bold text-green-600">0,00 €</p>
						</div>
						<div class="text-center px-4">
							<h3 class="text-sm font-medium text-gray-500 uppercase tracking-wide" data-i18n="vis_summary_expenses"></h3>
							<p id="totalExpenses" class="text-2xl font-bold text-red-600">0,00 €</p>
						</div>
						<div class="text-center px-4">
							<h3 class="text-sm font-medium text-gray-500 uppercase tracking-wide" data-i18n="vis_summary_balance"></h3>
							<p id="totalBalance" class="text-2xl font-bold text-gray-800">0,00 €</p>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div id="visContentLines" class="hidden flex-1 flex flex-col">
			
			<div class="py-2 border-b border-gray-200 bg-gray-50 grid place-items-center">

	/**

	const Utils = (function() {
		/**
		 * Zeigt eine Statusleiste am oberen Rand der Seite an.
		 * @param {string} msgKey   Der Schlüssel für die Übersetzungsfunktion L().
		 * @param {string} [type='info']   Der Typ der Nachricht ('info', 'success', 'error').
		 * @param {...*} args   Argumente, die an die Übersetzungsfunktion L() übergeben werden.
		 */
		function showStatus(msgKey, type = 'info', ...args) {
			const msg = L(msgKey, ...args);
			
			DOM.statusBar.textContent = msg;
			DOM.statusBar.classList.remove('hidden', 'bg-blue-50', 'text-blue-800', 'bg-red-50', 'text-red-800', 'bg-green-50', 'text-green-800');

			if (type === 'error') DOM.statusBar.classList.add('bg-red-50', 'text-red-800');
			else if (type === 'success') DOM.statusBar.classList.add('bg-green-50', 'text-green-800');
			else DOM.statusBar.classList.add('bg-blue-50', 'text-blue-800');

			DOM.statusBar.classList.remove('hidden');
			setTimeout(() => DOM.statusBar.classList.add('hidden'), 5000);
		}

		/**
		 * Zeigt ein modales Bestätigungsfenster an.
		 */
		function showConfirmationModal(titleKey, messageKey, confirmTextKey = 'modal_btn_confirm', args = [], isInfo = false) {
			return new Promise(resolve => {
				DOM.modalTitle.textContent = L(titleKey);
				DOM.modalMessage.innerHTML = L(messageKey, ...args);
				DOM.modalConfirmBtn.textContent = L(confirmTextKey);
				
				DOM.modalConfirmBtn.classList.toggle('hidden', isInfo); 
				DOM.modalCancelBtn.textContent = isInfo ? L("modal_btn_close") : L("modal_btn_cancel");
				
				DOM.modalTitle.classList.toggle('text-red-600', !isInfo);
				DOM.modalTitle.classList.toggle('text-[var(--color-scheme)]', isInfo);

				DOM.confirmationModal.classList.remove('hidden');
				setTimeout(() => {
					DOM.modalContent.classList.remove('scale-95', 'opacity-0');
				}, 10);

				const confirmHandler = () => {
					closeModal();
					resolve(true);
				};
				const cancelHandler = () => {
					closeModal();
					resolve(false);
				};

				const closeModal = () => {
					DOM.modalContent.classList.add('scale-95', 'opacity-0');
					setTimeout(() => {
						DOM.confirmationModal.classList.add('hidden');
					}, 300);
					
					DOM.modalConfirmBtn.removeEventListener('click', confirmHandler);
					DOM.modalCancelBtn.removeEventListener('click', cancelHandler);
					DOM.modalCancelBtn.textContent = L("modal_btn_cancel"); 
				};

				DOM.modalConfirmBtn.addEventListener('click', confirmHandler);
				DOM.modalCancelBtn.addEventListener('click', cancelHandler);
			});
		}
		
		/**
		 * Parst ein Datum (String oder Date) und gibt ein Date Objekt oder null zurück.
		 * Unterstützt: YYYY-MM-DD, YYYYMMDD, DD.MM.YYYY, MM/DD/YYYY.
		 */
		function parseGermanDate(dateStr) {
			if (!dateStr) return null;
			if (dateStr instanceof Date) return isNaN(dateStr.getTime()) ? null : dateStr;

			let s = String(dateStr).trim();
			if (s === '') return null;

			s = s.split('T')[0].split(' ')[0].trim();

			// ISO / einfache Formate
			if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(s)) {
				const d = new Date(s.replace(/\//g, '-'));
				return isNaN(d.getTime()) ? null : d;
			}

			// Kompaktformat YYYYMMDD
			if (/^\d{8}$/.test(s)) {
				const y = +s.slice(0, 4);
				const m = +s.slice(4, 6);
				const d = +s.slice(6, 8);
				const date = new Date(y, m - 1, d);
				return isNaN(date.getTime()) ? null : date;
			}

			// Europäisches Format DD.MM.YYYY
			if (/^\d{1,2}\.\d{1,2}\.\d{2,4}$/.test(s)) {
				const [d, m, y] = s.split('.').map(v => parseInt(v, 10));
				const year = y < 100 ? (y < 70 ? 2000 + y : 1900 + y) : y;  // 2069 todo :) use a rolling date here
				const date = new Date(year, m - 1, d);
				return isNaN(date.getTime()) ? null : date;
			}

			// US Format MM/DD/YYYY
			if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)) {
				const [m, d, y] = s.split('/').map(v => parseInt(v, 10));
				const year = y < 100 ? (y < 70 ? 2000 + y : 1900 + y) : y;
				const date = new Date(year, m - 1, d);
				return isNaN(date.getTime()) ? null : date;
			}
			
			//  weirdes Format. LastExit: Frage den Browser...
			// console.log("Debug: Date parsing fallback triggered for string:", s);
			
			const fallback = new Date(s);
			
			// Check ob der Fallback geklappt hat sonst Invalid Date.
			if (isNaN(fallback.getTime())) {
				console.log("Debug: Parsing completely failed for:", s);
				return null;
			}
			
			return fallback;
		}

		/**
		 * Parst einen Zahlen String robust und gibt eine Zahl zurück.
		 */
		function parseGermanNumber(numStr) {
			if (numStr === null || numStr === undefined) return 0;
			if (typeof numStr === 'number' && !isNaN(numStr)) return numStr;

			let s = String(numStr).trim();
			if (s === '') return 0;

			const isNegative = /^\s*\(.*\)\s*$/.test(s);
			
			const cleanedS = s.replace(/[^0-9\.,\-\+eE\s\u00A0\u202F']/g, '')
							.replace(/[\s\u00A0\u202F']/g, '')
							.replace(/^\s*\(|\)\s*$/g, ''); 
			
			const lastComma = cleanedS.lastIndexOf(',');
			const lastDot = cleanedS.lastIndexOf('.');
			
			let processedS = cleanedS;

			// Heuristik: Ob Komma oder Punkt der Dezimaltrenner ist, basierend auf der Position.
			if (lastComma !== -1 && lastDot !== -1) {
				if (lastComma > lastDot) processedS = cleanedS.replace(/\./g, '').replace(',', '.');
				else processedS = cleanedS.replace(/,/g, '');
			} else if (lastComma !== -1) {
				const after = cleanedS.slice(lastComma + 1);
				processedS = (/^\d{1,3}$/.test(after)) ? cleanedS.replace(',', '.') : cleanedS.replace(/,/g, '');
			} else if (lastDot !== -1) {
				const after = cleanedS.slice(lastDot + 1);
				if (!/^\d{1,3}$/.test(after)) processedS = cleanedS.replace(/\./g, '');
			}

			processedS = processedS.replace(/[^0-9\.\-\+eE]/g, '');

			let parsed = parseFloat(processedS);
			
			if (isNaN(parsed)) {
				// console.log("Debug: Number parsing failed completely for", numStr);
				parsed = 0;
			}
			if (isNegative) parsed = -Math.abs(parsed);
			
			return parsed;
		}

		function formatDateForInput(dateObj) {
			if (!dateObj || isNaN(dateObj.getTime())) return '';
			// 2512 Fix dont use toISOString. Es wandelt in UTC um was in Zeitzonen östlich von Greenwich zum vorherigen Tag führt
			const year = dateObj.getFullYear();
			const month = String(dateObj.getMonth() + 1).padStart(2, '0');
			const day = String(dateObj.getDate()).padStart(2, '0');

			return `${year}-${month}-${day}`;
		}

		function updateTexts() {
			//  Statische Texte via data i18n
			document.title = L('app_title');
			document.querySelector('header h1').innerHTML = `<i class="fas fa-person"></i> ${L('app_title')}`;
			
			document.querySelectorAll('[data-i18n], [data-i18n-title]').forEach(el => {
				
				if (el.hasAttribute('data-i18n')) {
					const key = el.getAttribute('data-i18n');
					const text = L(key);

					if (el.tagName === 'INPUT') {
						if (el.type === 'submit' || el.type === 'button') {
							el.value = text;
						} else if (el.placeholder) {
							el.placeholder = text;
						}
					} else if (el.tagName === 'BUTTON') {
						let textNode = Array.from(el.childNodes).find(node => node.nodeType === 3 || (node.nodeType === 1 && node.tagName === 'SPAN'));
						if (textNode) {
							if(textNode.nodeType === 3) textNode.textContent = text;
							else textNode.textContent = text;
						} else {
							el.textContent = text; 
						}
					} else {
						el.textContent = text;
					}
				}
				// Tooltips
				if (el.hasAttribute('data-i18n-title')) {
					const titleKey = el.getAttribute('data-i18n-title');
					el.title = L(titleKey);
				}
			});
				
			DOM.mappingInstruction.innerHTML = L('mapping_instruction_base') + ' <br>' +
			DOM.MAPPING_FIELDS.map(f => `<span id="map-label-${f}">${L(f)}</span>`).join(', ');
		}

		return {
			showStatus,
			showConfirmationModal,
			parseGermanDate,
			parseGermanNumber,
			formatDateForInput,
			updateTexts
		};
	})();


	/**
	 * @namespace Store
	 * @description Singleton für das zentrale State Management (Pub/Sub).
	 */
	const Store = (function() {
		const _initialState = {
			tableData: [],
			savedRules: [],
			selTopCats: [], // Top10 Listview
			currentCurrency: DOM.DEFAULT_CURRENCY
		};
		
		let _state = { ..._initialState };
		let _listeners = [];

		function _emit(eventType = 'session_changed') {
			const stateCopy = { ..._state };
			_listeners.forEach(listener => listener(stateCopy, eventType));
		}
		
		function _applyRuleToData(rule, dataSet) {
			if (!rule.search) return 0;
			let appliedCount = 0;
			const term = rule.search.toLowerCase();
			
			dataSet.forEach(row => {
				if (row.manual) return;

				// 260114 Suche in Feld Optional 
				const purposeMatch = (row["Verwendungszweck"] || '').toLowerCase().includes(term);
				const optionalMatch = (row["Optional"] || '').toLowerCase().includes(term);
				
				if (purposeMatch || optionalMatch) {
					row['Kategorie'] = rule.category;
					if (rule.isFixkosten) {
						row['Fixkosten'] = 1;
					}
					appliedCount++;
				}
			});
			return appliedCount;
		}

		return {
			subscribe: function(callback) {
				_listeners.push(callback);
			},

			getState: function() {
				return { ..._state };
			},

			setTableData: function(data) {
				_state.tableData = Array.isArray(data) ? data : [];
				_emit('session_changed'); 
			},
			
			updateTableDataField: function(rowId, field, newValue) {
				const index = _state.tableData.findIndex(row => row.id == rowId);

				if (index !== -1) {
					let updatedRow = { ..._state.tableData[index] };
					 // Bleibt unkommentiert, damit wir den Data Flow live tracen können.
					console.log(`Debug: Updating row ${rowId}, field: ${field} ->`, newValue);

					updatedRow[field] = newValue;
					 // Manuelle edits flaggen damit wir die nich überschreiben.
					if (field === 'Kategorie') {
						updatedRow.manual = true;
					}
					
					updatedRow.Fixkosten = updatedRow.Fixkosten ? 1 : 0; 
					const dateObj = Utils.parseGermanDate(updatedRow.Buchungstag);
					updatedRow.Buchungstag = dateObj ? Utils.formatDateForInput(dateObj) : '';
					updatedRow.Betrag = Utils.parseGermanNumber(updatedRow.Betrag);
					
					_state.tableData[index] = updatedRow;
					_emit('data_changed'); 
				} else {
					// Edge Case: Tabulator hat noch die alte ID, aber der State ist schon updated.
					console.log("Debug: Store update failed, rowId not found in current state", rowId);
				}
			},

			setRules: function(rules) {
				_state.savedRules = Array.isArray(rules) ? rules : [];
				_emit('session_changed');
			},
			
			setCurrency: function(currency) {
				_state.currentCurrency = currency || DOM.DEFAULT_CURRENCY;
				_emit('session_changed');
			},

			setSelTopCats: function(cats) { // top10 Listview sel doesnt change Data 
				_state.selTopCats = Array.isArray(cats) ? cats : [];
			},

			loadState: function(data, rules, currency, selTopCats) {
				// daten + regeln sanitizen 
				_state.tableData = (data || []).map(row => {
					const dObj = Utils.parseGermanDate(row.Buchungstag);
					
					return { 
						...row, 
						// 010126 Format ist 8601 YYYY-MM-DD
						Buchungstag: dObj ? Utils.formatDateForInput(dObj) : "", 
						Betrag: Utils.parseGermanNumber(row.Betrag),
						Fixkosten: row.Fixkosten ? 1 : 0,
						Kategorie: (row.Kategorie || "").toLowerCase()
					};
				});
				
				_state.savedRules = (rules || []).map(rule => ({ 
					...rule, 
					search: (rule.search || "").toLowerCase(),
					category: (rule.category || "").toLowerCase(),
					isFixkosten: rule.isFixkosten || false 
				}));
				
				_state.currentCurrency = currency || DOM.DEFAULT_CURRENCY;
				_state.selTopCats = Array.isArray(selTopCats) ? selTopCats : []; // TOP10 Listview
				
				DOM.delimiterInput.value = ";"; 
				_emit('session_changed');
				
				Utils.showStatus("msg_json_loaded", 'success', _state.tableData.length, _state.savedRules.length);
			},

			reset: function() {
				_state = { ..._initialState };
				_emit('session_changed'); 
			},
			
			addRule: function(search, category, isFixkosten) {
				const exists = _state.savedRules.some(r => r.search === search && r.category === category && r.isFixkosten === isFixkosten);
				
				if (!exists) {
					_state.savedRules.push({ search, category, isFixkosten });
					const affected = _applyRuleToData({ search, category, isFixkosten }, _state.tableData);
					Utils.showStatus("msg_rule_saved", 'success', affected);
					_emit('session_changed');
				} else {
					Utils.showStatus("msg_rule_exists", 'error');
				}
			},
			
			deleteRule: function(index) {
				_state.savedRules.splice(index, 1);
				
				const totalAffected = this.applyAllRules(true); 
				Utils.showStatus("msg_rule_deleted_reapplied", 'success', totalAffected);
				
				_emit('session_changed');
			},
			
			deleteAllRules: function() {
				if (_state.savedRules.length === 0) {
					Utils.showStatus("msg_no_rules_to_delete", 'info');
					return;
				}
				
				_state.savedRules = [];
				const totalAffected = this.applyAllRules(true); 
				Utils.showStatus("msg_rules_deleted", 'success');
				_emit('session_changed');
			},

			applyAllRules: function(silent = false) {
				let totalAffected = 0;

				// Kategorien nur resetten wenn sie nicht manuell editiert wurden				
				_state.tableData.forEach(row => {
					if (!row.manual) {
						row.Kategorie = "";
						row.Fixkosten = 0;
					}
				});

				_state.savedRules.forEach(rule => {
					totalAffected += _applyRuleToData(rule, _state.tableData);
				});
				
				if (!silent) {
					_emit('session_changed');
				}
				return totalAffected;
			},
			
			countMatches: function(searchTerm) {
				if (!searchTerm || _state.tableData.length === 0) return 0;
				const term = searchTerm.toLowerCase();
				
				// 260114 zählt in Zweck + Optional
				return _state.tableData.filter(row => 
					(row["Verwendungszweck"] || '').toLowerCase().includes(term) || 
					(row["Optional"] || '').toLowerCase().includes(term)
				).length;
			}
		};
	})();


	/**
	 * @namespace ImportModule
	 * @description Verwaltet den CSV Import, das Spalten Mapping und das Laden von JSON Sitzungen.
	 */
	const ImportModule = (function() {
		let _pendingData = [];
		let _pendingHeaders = [];
		let _fieldMappings = {};
		let _currentMappingIndex = 0;

		function _setupMappingStep(headers, previewData) {
			DOM.importInitialStep.classList.add('hidden');
			DOM.importMappingStep.classList.remove('hidden');

			_currentMappingIndex = 0;
			_fieldMappings = {};

			// Reset zu cancel button 
			DOM.cancelMappingBtn.classList.remove('bg-[var(--color-scheme)]', 'hover:bg-[var(--color-scheme-hover)]', 'text-white', 'font-bold', 'shadow-md');
			DOM.cancelMappingBtn.classList.add('bg-gray-200', 'hover:bg-gray-300', 'text-gray-700');
			DOM.cancelMappingBtn.innerHTML = ''; 
			DOM.cancelMappingBtn.setAttribute('data-i18n', 'mapping_btn_cancel');
			
			Utils.updateTexts();

			_updateMappingInstructionUI();

			DOM.previewMappingTableHead.innerHTML = '';
			const trHead = document.createElement('tr');
			headers.forEach(header => {
				const th = document.createElement('th');
				th.textContent = header;
				th.addEventListener('click', _handleHeaderClick);
				trHead.appendChild(th);
			});
			DOM.previewMappingTableHead.appendChild(trHead);

			DOM.previewMappingTableBody.innerHTML = '';
			previewData.forEach(row => {
				const tr = document.createElement('tr');
				headers.forEach(header => {
					const td = document.createElement('td');
					td.textContent = row[header] || '';
					tr.appendChild(td);
				});
				DOM.previewMappingTableBody.appendChild(tr);
			});
		}

		function _updateMappingInstructionUI() {
			DOM.MAPPING_FIELDS.forEach((field, index) => {
				const span = document.getElementById(`map-label-${field}`);
				if (!span) return;
				
				span.classList.remove('mapped', 'current');
				
				if (index < _currentMappingIndex) {
					span.classList.add('mapped');
				} else if (index === _currentMappingIndex) {
					span.classList.add('current');
				}
			});
		}

		function _handleHeaderClick(event) {
			const th = event.target;
			const clickedHeader = th.textContent;

			if (_currentMappingIndex >= DOM.MAPPING_FIELDS.length || th.classList.contains('mapped-header')) {
				return;
			}

			const fieldToMap = DOM.MAPPING_FIELDS[_currentMappingIndex];
			_fieldMappings[fieldToMap] = clickedHeader;

			th.classList.add('mapped-header');
			_currentMappingIndex++;
			_updateMappingInstructionUI();

			// idx 3, optional
			if (_currentMappingIndex === 3) {
				// magi3: grauen cancel btn zu grün Apply btn
				DOM.cancelMappingBtn.classList.remove('bg-gray-200', 'hover:bg-gray-300', 'text-gray-700');
				DOM.cancelMappingBtn.classList.add('bg-[var(--color-scheme)]', 'hover:bg-[var(--color-scheme-hover)]', 'text-white', 'font-bold', 'shadow-md');
				
				// Attribut entfernen, damit updateTexts() nicht überschreibt
				DOM.cancelMappingBtn.removeAttribute('data-i18n');
				DOM.cancelMappingBtn.innerHTML = `<i class="fas fa-check"></i> <span>${L('mapping_btn_fin')}</span>`;
				
				Utils.showStatus('msg_optional_field_ready', 'info'); 
			}

			// Auto Finish
			if (_currentMappingIndex === DOM.MAPPING_FIELDS.length) {
				Utils.showStatus('msg_all_fields_mapped', 'success');
				setTimeout(_finishImportProcess, 300);
			}
		}
		
		function _cancelMapping() {
			// 260114 bei Index 3 fungiert der Button als OK
			if (_currentMappingIndex >= 3) {
				_finishImportProcess();
				return;
			}

			DOM.importMappingStep.classList.add('hidden');
			DOM.importInitialStep.classList.remove('hidden');
			_pendingData = [];
			_pendingHeaders = [];
			_fieldMappings = {};
			_currentMappingIndex = 0;
			Utils.showStatus('msg_import_canceled', 'info');
			MainController.showPage('import'); 
		}

		/**
		 * Merged die Staging Daten in den Store
		 * appliziert automatisch die Regeln 
		 */
		function _finishImportProcess() {
			// Wenn Kategorie oder Fixkosten im csv, nutze sie.
			const csvCatHeader = _pendingHeaders.find(h => h.toLowerCase() === 'kategorie');
			const csvFixHeader = _pendingHeaders.find(h => h.toLowerCase() === 'fixkosten' || h.toLowerCase() === 'fix');

			const { tableData } = Store.getState();
			let nextId = 1;

			// Hole die höchste ID im Bestands
			if (tableData && tableData.length > 0) {
				const maxId = Math.max(...tableData.map(r => (typeof r.id === 'number' ? r.id : 0)));
				nextId = maxId + 1;
			}

			// console.log("DEBUG: Starting import with nextId: ", nextId);

			const importData = _pendingData.map((row, index) => {
				const newRow = { id: nextId + index };

				for (const [targetField, csvColName] of Object.entries(_fieldMappings)) {
					const rawVal = row[csvColName];

					if (targetField === 'Buchungstag') {
						const dateObj = Utils.parseGermanDate(rawVal);
						// ins ISO Format normalisieren
						newRow[targetField] = dateObj ? Utils.formatDateForInput(dateObj) : '';
					} else if (targetField === 'Betrag') {
						newRow[targetField] = Utils.parseGermanNumber(rawVal);
					} else {
						newRow[targetField] = rawVal || '';
					}
				}
				
				// Kate und Fixk Spalten aus Import übernehmen 
				const rawCat = csvCatHeader ? (row[csvCatHeader] || "") : "";
				newRow['Kategorie'] = rawCat.toLowerCase();
				
				if (csvFixHeader) {
					const rawFix = String(row[csvFixHeader] || '').toLowerCase().trim();
					// wilde Bool Formate zähmen
					newRow['Fixkosten'] = (rawFix === '1' || rawFix === 'true' || rawFix === 'ja' || rawFix === 'x' || rawFix === 'wahr') ? 1 : 0;
				} else {
					newRow['Fixkosten'] = 0;
				}
				
				return newRow;
			});
			
			if (importData.length > 0) {
				// Append Data
				const mergedData = [...tableData, ...importData];

				// // console.log("DEBUG: Merged size: ", mergedData.length);

				Store.setTableData(mergedData);
				
				const { savedRules } = Store.getState();
				if (savedRules.length > 0) {
					const affected = Store.applyAllRules();
					Utils.showStatus("msg_rules_applied_on_import", 'success', affected);
				}
			}

			_pendingData = [];
			_pendingHeaders = [];
			
			DOM.importMappingStep.classList.add('hidden');
			DOM.importInitialStep.classList.remove('hidden');
			
			MainController.showPage('categorize');
		}
		
		function _handleCsvInput(e) {
			const file = e.target.files[0];
			if (!file) return;

			const delimiter = DOM.delimiterInput.value || ';';
		   
			Papa.parse(file, {
				delimiter: delimiter,
				header: true,
				skipEmptyLines: true,
				complete: function(results) {
					if ((results.errors.length > 0 && results.data.length === 0) || !results.meta.fields) {
						Utils.showStatus("msg_parsing_error", 'error');
						console.log("Debug: CSV Parse Error", results.errors);
						return;
					}

					_pendingData = results.data;
					_pendingHeaders = results.meta.fields;

					_setupMappingStep(_pendingHeaders, _pendingData.slice(0, 4));
				},
				error: function(err) {
					Utils.showStatus("msg_crit_error", 'error', err.message);
				}
			});
			DOM.csvInput.value = '';
		}
				
		function _handleJsonInput(e) {
		const file = e.target.files[0];
		if (!file) return;
		// 2512 onlyRuleflg um bestehende Regeln auf frische Daten anzuwenden
		const onlySetChk = document.getElementById('onlySetChk');
		const onlySetFlg = onlySetChk ? onlySetChk.checked : false;
		const reader = new FileReader();
		reader.onload = function(event) {
			try {
				const text = event.target.result;
				const parsedData = JSON.parse(text);
				if (!parsedData || !Array.isArray(parsedData.data) || !Array.isArray(parsedData.rules)) throw new Error(L("msg_json_invalid"));
				// 2606 load existing data so we could land in categories View later.
				const dataToLoad = onlySetFlg ? Store.getState().tableData : parsedData.data;
				// 2512 reloade selected top10 categories
				Store.loadState(dataToLoad, parsedData.rules, parsedData.currency, parsedData.selTopCats);
				if (onlySetFlg) {
					MainController.showPage('categorize');
				} else {
					MainController.showPage('visualize'); 
				}
			} catch (err) { Utils.showStatus("msg_crit_error", 'error', err.message); Store.reset(); }
		};
		reader.onerror = function() { Utils.showStatus("msg_crit_error", 'error', "Fehler beim Lesen"); };
		reader.readAsText(file);
		DOM.jsonInput.value = '';
		}
		return {
			init: function() {
				DOM.startNewBtn.addEventListener('click', () => MainController.showPage('import'));
				DOM.loadSessionBtn.addEventListener('click', () => MainController.showPage('loadJson'));
				DOM.csvInput.addEventListener('change', _handleCsvInput);
				DOM.jsonInput.addEventListener('change', _handleJsonInput);
				DOM.cancelMappingBtn.addEventListener('click', _cancelMapping);
			}
		};
	})();


	/**
	 * @namespace CategorizeModule
	 * @description Verwaltet die Haupt Daten Tabelle (Tabulator) und die Regel UI.
	 */
	const CategorizeModule = (function() {
		let _tableInst = null;
		let _isInitialized = false;
		let _tableReadyPromise = null;

		/**
		 * Initialisiert die Tabulator Instanz
		 * lokale cell Events wegen data sync bugs
		 */
		/**
		 * Initialisiert die Tabulator Instanz
		 * lokale cell Events wegen data sync bugs
		 */
		function _initTable(data) {
			if (_tableInst) _tableInst.destroy();
			
			DOM.emptyState.classList.add('hidden');
			const { currentCurrency } = Store.getState();
			const knownColumns = {
				"Buchungstag": { 
					title: L("Buchungstag"),
					field: "Buchungstag",
					editor: "date",
					width: 100, 
					// Performance ISO8601 Strings sortieren sich automatisch mit dem stdsorter
					sorter: "string",
					// Für die Anzeige wird YYYY-MM-DD zu DD.MM.YYYY
					formatter: function(cell) {
						const val = cell.getValue();
						if (!val) return "";
						const parts = val.split('-');
						if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
						return val;
					},
					cellEdited: function(cell) {
						const id = cell.getRow().getData().id;
						const newValue = cell.getValue();
						// Input type date ist schon n ISO
						Store.updateTableDataField(id, "Buchungstag", newValue);
					}
				},
				"Verwendungszweck": { title: L("Verwendungszweck"), sorter: "string", headerFilter:"input", formatter: "textarea", minWidth: 200, 
					cellEdited: function(cell) {
							const id = cell.getRow().getData().id;
							const newValue = cell.getValue();
							Store.updateTableDataField(id, "Verwendungszweck", newValue);
						}
				},
				// 260114 Added Optional
				"Optional": { title: L("Optional"), sorter: "string", headerFilter:"input", formatter: "textarea", maxWidth: 130,
					cellEdited: function(cell) {
						const id = cell.getRow().getData().id;
						const newValue = cell.getValue();
						Store.updateTableDataField(id, "Optional", newValue);
					}
				},
				"Betrag": { title: L("Betrag"), sorter: "number", hozAlign: "right", width: 100, 
					editor: "number",
					formatter:"money", formatterParams:{decimal:",", thousand:".", symbol: currentCurrency, symbolAfter:true},
					cellEdited: function(cell) {
						const id = cell.getRow().getData().id;
						const newValue = cell.getValue();
						Store.updateTableDataField(id, "Betrag", newValue);
					}							
				},
				"Kategorie": { title: L("Kategorie"), sorter: "string", headerFilter:"input", width: 120,
					editor: "input",
					formatter: function(cell) {
						const val = cell.getValue();

						if (!val) return `<span class="text-gray-300 italic text-xs">${L('category_placeholder')}</span>`; 
						//260107 Themable Bubbles  return `<span class="px-2 py-1 rounded-full text-xs font-semibold" style="background-color: var(--color-scheme); color: white;">${val}</span>`;
						return `<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-xs font-semibold">${val}</span>`;
					},
					cellEdited: function(cell) {
						const id = cell.getRow().getData().id;
						const rawVal = cell.getValue() || "";
						const lowVal = rawVal.toLowerCase();
						// console.log("debug: cat changed to " + lowVal);
						Store.updateTableDataField(id, "Kategorie", lowVal);
					}
				},
				"Fixkosten": { title: L("Fixkosten"), sorter: "boolean", hozAlign: "center", width: 60, 
					formatter: "tickCross", 
					cellClick: function(e, cell) { 
						const id = cell.getRow().getData().id;
						const newValue = !cell.getValue();
						cell.setValue(newValue); 
						Store.updateTableDataField(id, "Fixkosten", newValue);
					}
				}
			};

			const columns = [];
			if (!data || data.length === 0) {
				DOM.emptyState.classList.remove('hidden');
				return;
			}
			
			const dataKeys = Object.keys(data[0]).filter(key => key !== 'id');
			const knownKeys = Object.keys(knownColumns);
			
			knownKeys.forEach(key => {
				// 260114 wenn vorh dann Optional eingefügn
				if (key !== 'Kategorie' && key !== 'Fixkosten' && dataKeys.includes(key)) {
					columns.push({ ...knownColumns[key], field: key });
				}
			});
			
			if (dataKeys.includes('Kategorie')) columns.push({ ...knownColumns['Kategorie'], field: 'Kategorie' });
			if (dataKeys.includes('Fixkosten')) columns.push({ ...knownColumns['Fixkosten'], field: 'Fixkosten' });

			_tableReadyPromise = new Promise((resolve) => {
				_tableInst = new Tabulator("#data-table", {
					data: data,
					layout: "fitColumns",
					height: "100%",
					columns: columns,
					movableColumns: true,
					resizableRows: true,
					initialSort: [
						{ column: "Buchungstag", dir: "desc" }
					],
					index: "id",
					tableBuilt: function() {
						resolve();
					}
				});
			});
		}

		function _getAllCategories(state) {
			const categories = new Set();
			
			state.tableData.forEach(row => {
				if (row.Kategorie) {
					categories.add(row.Kategorie.trim());
				}
			});

			state.savedRules.forEach(rule => {
				if (rule.category) {
					categories.add(rule.category.trim());
				}
			});

			categories.delete('');
			return categories;
		}

		function _renderCategoryDatalist(state) {
			const categories = _getAllCategories(state);
			const datalistEl = DOM.categoryDatalist;
			
			datalistEl.innerHTML = '';
			
			Array.from(categories).sort().forEach(cat => {
				const option = document.createElement('option');
				option.value = cat;
				datalistEl.appendChild(option);
			});
		}

		function _updateMatchCountAndButtonState() {
			const searchTerm = DOM.ruleSearch.value.trim();
			const categoryValue = DOM.ruleCategory.value.trim();
			const count = Store.countMatches(searchTerm);
			
			DOM.matchCountPreview.innerHTML = `${count} <span data-i18n="rules_match_preview"></span>`;
			Utils.updateTexts();

			const hasInput = searchTerm.length > 0 && categoryValue.length > 0;
			const isInputEnabled = !DOM.ruleSearch.disabled;
			
			DOM.saveRuleBtn.disabled = !(hasInput && isInputEnabled);
		}

		function _updateMatchPreviewAndFilter() {
			_updateMatchCountAndButtonState();
			const searchTerm = DOM.ruleSearch.value.trim();
			
			if (_tableInst) {
				if (searchTerm.length > 0) {
					_tableInst.setFilter("Verwendungszweck", "like", searchTerm);
				} else {
					_tableInst.clearFilter();
				}
			}
		}

		function _renderRulesList(rules) {
			DOM.rulesList.innerHTML = '';
			
			if (rules.length === 0) {
				DOM.rulesList.innerHTML = `<li class="text-gray-500 text-sm italic text-center pt-4" data-i18n="rules_list_empty"></li>`;
				Utils.updateTexts(); 
				DOM.runAllRulesBtn.classList.add('hidden');
				DOM.deleteAllRulesBtn.classList.add('hidden');
				return;
			}
			
			DOM.runAllRulesBtn.classList.remove('hidden');
			DOM.deleteAllRulesBtn.classList.remove('hidden');

			rules.forEach((rule, index) => {
				const li = document.createElement('li');
				li.className = "bg-white p-1 rounded border border-gray-200 flex items-center";
				
				const fixkostenIcon = rule.isFixkosten 
					? `<i class="fas fa-file-invoice-dollar text-xs text-purple-500 ml-1" title="${L('Fixkosten')}"></i>`
					: '';
				
				li.innerHTML = `
					<div class="flex justify-between items-center w-full text-xs">  <div class="flex-grow text-xs truncate flex items-center">
							<span class="font-medium text-gray-800">"${rule.search}"</span>
							<i class="fas fa-arrow-right text-xs text-[var(--color-scheme)] mx-1"></i> <span class="font-semibold bg-blue-100 text-blue-800 px-1 py-0.5 rounded-full text-3xs">${rule.category}</span> ${fixkostenIcon}
						</div>
						<button data-index="${index}" class="delete-rule-btn flex-shrink-0 text-gray-400 hover:text-red-600 transition ml-2 px-1 py-0.5" title="${L('rules_btn_delete')}"> <i class="fas fa-trash-alt fa-xs"></i> </button>
					</div>
				`;
				li.querySelector('.delete-rule-btn').addEventListener('click', _handleDeleteRuleClick);
				DOM.rulesList.appendChild(li);
				IconLoader.run(li);
			});
		}
	
		async function _handleSaveRule() {
			const search = DOM.ruleSearch.value.trim().toLowerCase();
			const cat = DOM.ruleCategory.value.trim().toLowerCase(); 
			const isFixkosten = DOM.ruleFixcostChk.checked;
			
			if (!search || !cat) {
				Utils.showStatus("msg_rule_missing_fields", 'error'); 
				return;
			}
			
			Store.addRule(search, cat, isFixkosten);
			
			DOM.ruleSearch.value = '';
			DOM.ruleCategory.value = ''; 
			DOM.ruleFixcostChk.checked = false;
			
			if (_tableInst && _tableReadyPromise) {
				await _tableReadyPromise; 
				_tableInst.clearFilter();
			}
			
			_updateMatchCountAndButtonState();
		}

		async function _handleRunAllRules() {
			const { tableData, savedRules } = Store.getState();
			if (tableData.length === 0 || savedRules.length === 0) return;
			
			const totalAffected = Store.applyAllRules(); 
			Utils.showStatus("msg_rules_applied", 'success', totalAffected);
			
			if (_tableInst && _tableReadyPromise) {
				await _tableReadyPromise;
				_tableInst.clearFilter();
			}
		}

		async function _handleDeleteAllRules() {
			const { savedRules } = Store.getState();
			if (savedRules.length === 0) {
				Utils.showStatus("msg_no_rules_to_delete", 'info');
				return;
			}

			const isConfirmed = await Utils.showConfirmationModal(
				"confirm_delete_all_rules_title",
				"confirm_delete_all_rules_message",
				"confirm_delete_all_rules_btn",
				[savedRules.length] 
			);

			if (eventType === 'session_changed') {
				_renderRulesList(state.savedRules);
				_renderCategoryDatalist(state);
				_updateMatchCountAndButtonState();
			}

			DOM.ruleSearch.disabled = !hasData;
			DOM.ruleCategory.disabled = !hasData;
			DOM.ruleFixcostChk.disabled = !hasData;
			DOM.saveRuleBtn.disabled = !hasData;

			if (eventType === 'session_changed') {

						_tableInst = null;

		/** Wandelt ISO YYYY-MM-DD in lokales Date Objekt um.
		 * 010126 Nutzt nicht new Date(isoString) wegen greenwitch versatz
		 */
		function _isoToLocal(isoStr) {
			if (!isoStr) return null;
			const [y, m, d] = isoStr.split('-').map(Number);
			return new Date(y, m - 1, d); 
		}

		/** 010126 iso nach De für Tabulator Anzeige
		 */
		function _dateFormatter(cell) {
			const val = cell.getValue();
			if (!val) return "";
			const parts = val.split('-');
			// Fallback falls Datenmüll, sonst DD.MM.YYYY
			if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
			return val;
		}

		/** * 301225 setzt start u end datum basierend auf bereichswahl
		*/
		function _handleRangeSelect() {
			const val = DOM.dateRange.value;
			if (!val) return;

			const { tableData } = Store.getState();
			if (tableData.length === 0) return;

			if (val === 'all') {
				_setDateFiltersFromData(tableData);
				updateChart();
				return;
			}

			// finde aktuellstes datum im satz
			let maxIso = "";
			tableData.forEach(row => {
				if (row.Buchungstag > maxIso) maxIso = row.Buchungstag;
			});

			if (!maxIso) return;
			
			// Startdatum
			const maxDate = _isoToLocal(maxIso);
			let start = new Date(maxDate);
			let end = new Date(maxDate);

			if (val === 'current') {
				// 1 tag des monats
				start.setDate(1);
			} else {
				const months = parseInt(val);
				// Gehe X Monate zurück
				start.setDate(1);
				start.setMonth(start.getMonth() - (months - 1));
			}

			DOM.dateStart.value = Utils.formatDateForInput(start);
			DOM.dateEnd.value = Utils.formatDateForInput(end);

			updateChart();
		}

		/* Daten Verarbeitung */
		
		function _getFilteredData(tableData) {
			// DOM inputs sind bereits YYYY MM DD Strings
			let startStr = DOM.dateStart.value;
			let endStr = DOM.dateEnd.value;
			//0626 fix Datenvalidierung
			if (!startStr && !endStr) {
				startStr = "0000-00-00";
				endStr = "9999-12-31";
			} else if (startStr && !endStr) {
				endStr = startStr;
			} else if (!startStr && endStr) {
				startStr = endStr;
			}

			if (startStr > endStr) {
				const temp = startStr;
				startStr = endStr;
				endStr = temp;
			}

			return tableData.filter(row => {
				const d = row.Buchungstag; 
				if (!d) return false;
				return d >= startStr && d <= endStr;
			});
		}


		function _calculateAndRenderTopListbox(filteredData) {
			const categoryTotals = {};
			// Summen pro Kategorie
			
			filteredData.forEach(row => {
				if (row.Betrag < 0 && !row.Fixkosten) {
					const category = (row.Kategorie || '').trim().toLowerCase();
					if (!category) return;
					categoryTotals[category] = (categoryTotals[category] ?? 0) + Math.abs(row.Betrag);
				}
			});

			// Top 10 sortieren
			const topCategories = Object.entries(categoryTotals)
				.sort(([, a], [, b]) => b - a)
				.slice(0, 10)
				.map(([cat]) => cat);
				
			// Listbox füllen			
			const container = DOM.lineChartLegendContent;
			container.innerHTML = '';
			_topCatColors = {};
			
			if (topCategories.length === 0) {
				container.innerHTML = `<div class="text-xs text-gray-400 text-center italic p-2">Keine Daten</div>`;
				return;
			}

			topCategories.forEach((cat, index) => {
				const div = document.createElement('div');
				div.className = "flex items-center gap-2 p-1 hover:bg-gray-50 rounded cursor-pointer";
				
				// lade häkchen aus store
				const isChecked = _selectedTopCategories.has(cat);
				
				// Farbe für später im Diagramm speichern
				const color = DOM.CHART_COLORS[index % DOM.CHART_COLORS.length];				
				_topCatColors[cat] = color;
				
				// Farbindikator für die Legende				
				const colorBox = `<span class="w-2 h-2 rounded-full inline-block" style="background-color: ${color};"></span>`;
				
				div.innerHTML = `
					<input type="checkbox" id="chk-top-${index}" value="${cat}" class="w-3 h-3 text-[var(--color-scheme)] rounded cursor-pointer" ${isChecked ? 'checked' : ''}>
					<label for="chk-top-${index}" class="text-xs text-gray-700 cursor-pointer flex-1 truncate select-none flex items-center gap-2">
						${colorBox} ${cat}
					</label>
				`;
		
				// Event Listener für Liveupdate				
				div.querySelector('input')?.addEventListener('change', (e) => {
					if (e.target.checked) {
						_selectedTopCategories.add(cat);
					} else {
						_selectedTopCategories.delete(cat);
					}
					// console.log("debug cats", _selectedTopCategories)
					// speichere häckchen im store
					Store.setSelTopCats(Array.from(_selectedTopCategories));
					_updateChartOnly(); 
				});
				
				container.appendChild(div);
			});
		}
		
		// Berechnet Top 10 details Tabelle
		function _calcTop10(variData) {
			const allExp = [...variData];
			const catSums = {};
			let uncategSum = 0;

			allExp.forEach(row => {
				const cat = (row.Kategorie || '').trim();
				const amt = Math.abs(row.Betrag || 0);
				
				if (!cat) {
					uncategSum += amt;
				} else {
					const key = cat.toLowerCase();
					if (!catSums[key]) catSums[key] = { name: cat, sum: 0 };
					catSums[key].sum += amt;
				}
			});

			const sorted = Object.values(catSums).sort((a, b) => b.sum - a.sum);
			const top10 = sorted.slice(0, 10);
			const rest = sorted.slice(10);

			let otherSum = uncategSum;
			rest.forEach(item => otherSum += item.sum);

			const result = top10.map((item, idx) => ({
				rank: idx + 1,
				kategorie: item.name,
				betrag: -item.sum,
				isOther: false
			}));

			result.push({
				rank: '',
				kategorie: 'Other',
				betrag: -otherSum,
				isOther: true
			});

			return result;
		}

		 */
		function _aggregateData(filteredData, customCategories = []) {
			const einnahmenData = [];
			const ausgabenData = [];
			const scatterData = [];
			
			let totalIncome = 0;
			let totalExpenses = 0;
			let totalFixedExpenses = 0;
			let totalVariableExpenses = 0;
			
			const monthlyData = {};
			const customMonthlyData = {};
			const uniqueMonths = new Set();
			
			const customCategorySet = new Set(customCategories || []);
			
			filteredData.forEach(row => {
				const amount = row.Betrag || 0;
				const tableRow = { ...row };
				const date = _isoToLocal(row.Buchungstag);
				
				if (amount > 0) {
					einnahmenData.push(tableRow);
					totalIncome += amount;
				} else if (amount < 0) {
					ausgabenData.push(tableRow);
					totalExpenses += amount;
					
					if (row.Fixkosten) totalFixedExpenses += amount;
					else totalVariableExpenses += amount;
					
					// Scatter braucht nur Ausgaben und valides Date obj
					if (date && !row.Fixkosten) {
						scatterData.push({
							x: date.getTime(),
							y: Math.abs(amount),
							label: row["Verwendungszweck"] || L('tooltip_unknown')
						});
					}
				}
				
				 // Monthly Aggre Logic; Performance mit String Slice
				if (!row.Buchungstag) return;
				
				// 2025-01-01 -> 2025-01
				const monthKey = row.Buchungstag.substring(0, 7);
				uniqueMonths.add(monthKey);

				if (!monthlyData[monthKey]) monthlyData[monthKey] = { income: 0, fixed: 0, variable: 0 };
				
				if (amount > 0) {
					monthlyData[monthKey].income += amount;
				} else if (amount < 0) {
					const absAmount = Math.abs(amount);
					if (row.Fixkosten) {
						monthlyData[monthKey].fixed += absAmount;
					} else {
						monthlyData[monthKey].variable += absAmount;
					}
					
					// Daten für Custom Lines sammeln
					if (customCategorySet.size > 0) {
						const rowCategory = (row.Kategorie || '').trim().toLowerCase();
						if (!customMonthlyData[monthKey]) customMonthlyData[monthKey] = {};

						if (customCategorySet.has(rowCategory)) {
							customMonthlyData[monthKey][rowCategory] ??= 0;
							customMonthlyData[monthKey][rowCategory] += absAmount;
						} 
					}
				}
			});

			const variableAusgabenData = ausgabenData.filter(row => !row.Fixkosten);
			const fixeAusgabenData = ausgabenData.filter(row => !!row.Fixkosten);
			const totalBalance = totalIncome + totalExpenses;

			return {
				einnahmenData, variableAusgabenData, fixeAusgabenData, scatterData,
				monthlyData, customMonthlyData, uniqueMonths,
				totals: { totalIncome, totalExpenses, totalFixedExpenses, totalVariableExpenses, totalBalance }
			};
		}

		/**
		 * Bereitet die Daten für die Kreisdiagramme vor.
		 */
		function _preparePieData(variableAusgabenData, totals) {
			if (!variableAusgabenData) return { expensePie: {}, overviewPie: {} };

			const categoryTotalsVariableExpenses = {};
			
			variableAusgabenData.forEach(row => {
				const category = row.Kategorie || L("category_placeholder");
				const amount = Math.abs(row.Betrag);
				
				categoryTotalsVariableExpenses[category] ??= 0;
				categoryTotalsVariableExpenses[category] += amount;
			});

			return {
				expensePie: { categoryTotals: categoryTotalsVariableExpenses },
				overviewPie: { totalIncome: totals.totalIncome, totalFixedExpenses: totals.totalFixedExpenses, totalVariableExpenses: totals.totalVariableExpenses }
			};
		}

		/**
		 * Baut die Datasets für die Liniendiagramme zusammen.
		 */
		function _prepareLineData(monthlyData, customMonthlyData, customCategories, uniqueMonths) {
			const sortedMonths = Array.from(uniqueMonths).sort();
			
			// Standard LineDiagram Datensätze
			const incomeData = [], fixedData = [], varData = [], totalMonthlyExpenseData = [], balanceData = [], cumExpenseData = [];
			let cumExpense = 0;

			sortedMonths.forEach(k => {
				const mData = monthlyData[k] ?? { income: 0, fixed: 0, variable: 0 };
				const inc = mData.income;
				const fix = mData.fixed;
				const vari = mData.variable;
				const totalExp = fix + vari;
				const currentBalance = inc - totalExp;
				
				cumExpense += totalExp;

				incomeData.push(inc);
				fixedData.push(fix);
				varData.push(vari);
				totalMonthlyExpenseData.push(totalExp);
				balanceData.push(currentBalance);
				cumExpenseData.push(cumExpense);
			});

			const lineChartData = { 
				labels: sortedMonths, incomeData, fixedData, varData, 
				cumulativeExpenseData: cumExpenseData, totalMonthlyExpenseData, balanceData 
			};
			
			// TopX Line Data Sets bauen
			const topLineChartDatasets = [];
			
			if (customCategories && customCategories.length > 0) {
				customCategories.forEach((category, index) => {
					const data = sortedMonths.map(month => {
						return customMonthlyData[month]?.[category] ?? 0;
					});
			
					// Nutze Farbe aus der top10 Listbox
					const color = _topCatColors[category] 
					
					topLineChartDatasets.push({
						label: category, 
						data: data,
						borderColor: color,
						backgroundColor: color, 
						fill: false,
						tension: 0.2
					});
				});
			}

			return {
				lineChart: lineChartData,
				topLineChart: { labels: sortedMonths, datasets: topLineChartDatasets }
			};
		}

		/**
		 * Koordiniert die Datenverarbeitungsroutinen. 
		 */
		function _processData(filteredData, customCategories = []) {
			const aggResult = _aggregateData(filteredData, customCategories);
			
			if (!aggResult) {
				return { summary: {}, details: {}, expensePie: {}, overviewPie: {}, lineChart: {}, topLineChart: {}, scatterPlot: {} };
			}

			const { einnahmenData, variableAusgabenData, fixeAusgabenData, scatterData, monthlyData, customMonthlyData, uniqueMonths, totals } = aggResult;
			// Pie chart
			const pieData = _preparePieData(variableAusgabenData, totals);
			// Line chart
			const lineData = _prepareLineData(monthlyData, customMonthlyData, customCategories, uniqueMonths);
			// top 10 details
			const top10data = _calcTop10(variableAusgabenData);

			return {
				summary: { totalIncome: totals.totalIncome, totalExpenses: totals.totalExpenses, totalBalance: totals.totalBalance },
				details: { einnahmenData, variableAusgabenData, fixeAusgabenData, top10data },
				expensePie: pieData.expensePie,
				overviewPie: pieData.overviewPie,
				lineChart: lineData.lineChart,
				topLineChart: lineData.topLineChart,
				scatterPlot: { data: scatterData }
			};
		}

		function _refreshPieSection(processedData, currentCurrency) {
			if (DOM.visPieContentOverview.classList.contains('hidden')) return;

			if (_activeOverviewTab === 'categories') {
				DOM.overviewChartContainer.classList.add('hidden');
				DOM.categoriesChartContainer.classList.remove('hidden');
				
				_myOverviewChartInst?.destroy();
				_myOverviewChartInst = null;

				_updateCategoriesPieChart(processedData.expensePie, currentCurrency);
			} else {
				DOM.overviewChartContainer.classList.remove('hidden');
				DOM.categoriesChartContainer.classList.add('hidden');
				
				_myChartInst?.destroy();
				_myChartInst = null;

				_updateOverviewPieChart(processedData.overviewPie, currentCurrency);
			}
		}

		function _refreshLineSection(processedData, currentCurrency, isCustomChart) {
			if (DOM.visContentLines.classList.contains('hidden')) return;

			if (isCustomChart) {
				_updateLineChart(processedData.topLineChart, currentCurrency, true);
			} else {
				_updateLineChart(processedData.lineChart, currentCurrency, false); 
			}
		}

		function _refreshScatterSection(processedData, currentCurrency) {
			if (DOM.visContentScatter.classList.contains('hidden')) return;
			_updateScatterPlot(processedData.scatterPlot, currentCurrency);
		}

		async function _refreshDetailTables() {
			if (DOM.visContentDetails.classList.contains('hidden')) return;
			if (_activeDetailTab === 'einnahmen') await _updateEinnahmenTable(_cachedDetailData.einnahmenData);
			else if (_activeDetailTab === 'variable') await _updateVariableAusgabenTable(_cachedDetailData.variableAusgabenData);
			else if (_activeDetailTab === 'fixe') await _updateFixeAusgabenTable(_cachedDetailData.fixeAusgabenData);
			else if (_activeDetailTab === 'top10') await _updateTop10Table(_cachedDetailData.top10data);
		}

		// Wird intern aufgerufen, wenn nur Checkbox geklickt wird.
		async function _updateChartOnly() {
			const { tableData, currentCurrency } = Store.getState();
			if (tableData.length === 0) return;

			const filteredData = _getFilteredData(tableData);
			const { customCategories, isCustomChart } = _getCustomChartConfig();
			const processedData = _processData(filteredData, customCategories);

			_refreshLineSection(processedData, currentCurrency, isCustomChart);
		}

		async function updateChart() {
		// 260107 tabellen erst reRendern, wenn die Seite sichtbar ist.
			if (DOM.pageVisualize.classList.contains('hidden')) {
				_storeDirty = true;
				console.log("debug: page hidden, skipping chart update");
				return;
			}
			
			_storeDirty = false;
			const { tableData, currentCurrency } = Store.getState();
			
			if (tableData.length === 0) {
				_handleEmptyData();
				return;
			}

			const filteredData = _getFilteredData(tableData);
			
			// bei init und Datum-Change rendern wir die Listbox.
			if (_actLinMode === 'top') {
				_calculateAndRenderTopListbox(filteredData);
				DOM.lineChartLegendContainer.classList.remove('hidden');
			} else {
				DOM.lineChartLegendContainer.classList.add('hidden');
			}
			
			const { customCategories, isCustomChart } = _getCustomChartConfig();
			const processedData = _processData(filteredData, customCategories);
			
			_cachedDetailData = processedData.details;

			_updateSummaryUI(processedData.summary, currentCurrency);
			_refreshPieSection(processedData, currentCurrency);
			_refreshLineSection(processedData, currentCurrency, isCustomChart);
			_refreshScatterSection(processedData, currentCurrency);
			
			await _refreshDetailTables();
		} 
		
		function _updateSummaryUI(summary, currentCurrency) {
			const { totalIncome, totalExpenses, totalBalance } = summary;
			const currencyFormatter = (value) => `${value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currentCurrency}`;
			
			DOM.totalIncome.textContent = currencyFormatter(totalIncome);
			DOM.totalExpenses.textContent = currencyFormatter(Math.abs(totalExpenses));
			DOM.totalBalance.textContent = currencyFormatter(totalBalance);

			DOM.totalBalance.classList.remove('text-green-600', 'text-red-600', 'text-gray-800');
			if (totalBalance > 0.01) DOM.totalBalance.classList.add('text-green-600');
			else if (totalBalance < -0.01) DOM.totalBalance.classList.add('text-red-600');
			else DOM.totalBalance.classList.add('text-gray-800');
			
			DOM.summaryDisplay.classList.remove('hidden');
		}

											let value = context.raw || 0;

			if (isCustom) {
				labels = lineChartData.labels;
				datasets = lineChartData.datasets;
				title = 'Kategorien'; 
			} else {
				const { labels: lineChartLabels, incomeData, fixedData, varData, totalMonthlyExpenseData, balanceData } = lineChartData;
				labels = lineChartLabels;
				datasets = [
					// Einnahmen
					{ label: L('vis_summary_income'), data: incomeData, borderColor: DOM.OVERVIEW_CHART_COLORS.INCOME, backgroundColor: 'rgba(16, 185, 129, 0.2)', fill: true, tension: 0.2, yAxisID: 'y' },
					// Kumu Ausgaben
					{ label: L('vis_summary_expenses'), data: totalMonthlyExpenseData, borderColor: '#EAB308', backgroundColor: 'rgba(234, 179, 8, 0.1)', fill: false, tension: 0.1, yAxisID: 'y' },
					// Vari Ausgaben
					{ label: L('vis_nested_variable'), data: varData, borderColor: DOM.CHART_COLORS[0], backgroundColor: 'rgba(255, 99, 132, 0.2)', fill: true, tension: 0.2, yAxisID: 'y' },
					// Fixe Augaben
					{ label: L('vis_nested_fixed'), data: fixedData, borderColor: '#A74151', backgroundColor: 'rgba(153, 102, 250, 0.2)', fill: true, tension: 0.2, yAxisID: 'y' },
					// Saldo

				];

				DOM.chartEmptyStateLines.querySelector('p').textContent = msg;

				DOM.lineChartCanvas.classList.remove('hidden');

					_myLineChartInst.destroy();
					_myLineChartInst = null;
				}

					_myLineChartInst.options.plugins.title.text = title;

								tooltip: {

											let value = context.parsed.y || 0;
											return `${label}: ${value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currentCurrency}`;
										}
									}
								}
							},

							}
						}
					});
				}
			}
		}

				const catName = _myLineChartInst.data.datasets[datasetIndex].label;
				 console.log("Debug: dbl click detected on", catName);
				await showTab('details', 'variable');
			}
		}

				DOM.visTabScatter.addEventListener('click', () => showTab('scatter')); 
				
				DOM.visOverviewToggle.addEventListener('click', () => _handleOverviewToggle('overview'));
				DOM.visCategoriesToggle.addEventListener('click', () => _handleOverviewToggle('categories'));

				DOM.visTabEinnahmen.addEventListener('click', async () => {
					_handleNestedTabClick('einnahmen');
					await _refreshDetailTables();
				});
				DOM.visTabVariAusg.addEventListener('click', async () => {
					_handleNestedTabClick('variable');
					await _refreshDetailTables();
				});
				DOM.visTabFixeAusg.addEventListener('click', async () => {
					_handleNestedTabClick('fixe');
					await _refreshDetailTables();
				});
				DOM.visTabTop10.addEventListener('click', async () => {
					_handleNestedTabClick('top10');
					await _refreshDetailTables();
				});

				Store.subscribe((state, eventType) => {
					if (eventType === 'session_changed' || eventType === 'data_changed') {
						if (DOM.dateStart.value === '' && state.tableData.length > 0) {
							_setDateFiltersFromData(state.tableData);
						}
						updateChart();
					}
				});
				_isInitialized = true;
			},
			
			destroy: function() {
				_destroyCharts();
				_destroyDetailTables(); 
				
				const currencyFormatter = (value) => `${value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${DOM.DEFAULT_CURRENCY}`;
				DOM.totalIncome.textContent = currencyFormatter(0);
				DOM.totalExpenses.textContent = currencyFormatter(0);
				DOM.totalBalance.textContent = currencyFormatter(0);
				DOM.totalBalance.className = 'text-2xl font-bold text-gray-800';
				DOM.summaryDisplay.classList.add('hidden');
				
				DOM.dateStart.value = '';
				DOM.dateEnd.value = '';
				
				_actLinMode = 'all';
				_selectedTopCategories.clear();
				_updLinTogBtns();
			},
			
			update: updateChart,
			showTab: showTab
		};
	})();

	/**
	 * @namespace MainController
	 * @description Haupt Controller (Router). Verwaltet die Seitennavigation
	 * und globale Aktionen (Reset, Export, Save JSON).
	 */
	const MainController = (function() {
		
		function _updateNavState(activePage, dataLoaded) {
			const { BASE, ACTIVE, INACTIVE, DISABLED } = DOM.NAV_STYLES;
			
			const navs = [
				{ id: 'home', el: DOM.navHomeBtn, page: 'home', alwaysEnabled: true },
				{ id: 'import', el: DOM.navImportBtn, page: 'import', alwaysEnabled: true },
				{ id: 'categorize', el: DOM.navCategorizeBtn, page: 'categorize', alwaysEnabled: false },
				{ id: 'visualize', el: DOM.navVisualizeBtn, page: 'visualize', alwaysEnabled: false }
			];

			navs.forEach(nav => {
				const isActive = nav.page === activePage;
				const isEnabled = nav.alwaysEnabled || dataLoaded;
				
				// Style zusammenbauen
				let style = BASE;
				if (isActive) style += ` ${ACTIVE}`;
				else if (isEnabled) style += ` ${INACTIVE}`;
				else style += ` ${DISABLED}`;
				
				// Home Button hat extra icon
				if (nav.id === 'home') style += " flex items-center gap-2";
				
				nav.el.className = style;
				nav.el.disabled = !isEnabled;
			});
		}

		function showPage(pageName) {
			// Eckstein, Eckstein alles muss...
			[DOM.pageHome, DOM.pageImport, DOM.pageLoadJson, DOM.pageCategorize, DOM.pageVisualize].forEach(el => el.classList.add('hidden'));
			
			const { tableData } = Store.getState();
			const dataLoaded = tableData.length > 0;
			
			_updateNavState(pageName, dataLoaded);

			if (pageName === 'home') {
				DOM.pageHome.classList.remove('hidden');
				//DOM.headerActions.classList.add('hidden');

			} else if (pageName === 'import') {
				DOM.pageImport.classList.remove('hidden');
				DOM.headerNav.classList.remove('hidden');
				DOM.headerActions.classList.remove('hidden');
				
				// Default state for import
				ImportModule.init();
				DOM.importMappingStep.classList.add('hidden');
				DOM.importInitialStep.classList.remove('hidden');

			} else if (pageName === 'loadJson') {
				DOM.pageLoadJson.classList.remove('hidden');
				DOM.headerNav.classList.remove('hidden');
				DOM.headerActions.classList.remove('hidden');

			} else if (pageName === 'categorize' && dataLoaded) {
				DOM.pageCategorize.classList.remove('hidden');
				DOM.headerNav.classList.remove('hidden');
				DOM.headerActions.classList.remove('hidden');

			} else if (pageName === 'visualize' && dataLoaded) {
				DOM.pageVisualize.classList.remove('hidden');
				DOM.headerNav.classList.remove('hidden');
				DOM.headerActions.classList.remove('hidden');				
				VisualizeModule.showTab('overview');
				
			} else {
				// Fallback Home
				DOM.pageHome.classList.remove('hidden');
				DOM.headerActions.classList.add('hidden');
				DOM.headerNav.classList.add('hidden');
			}
			
			//DOM.resetBtn.classList.toggle('hidden', pageName === 'home');
			DOM.exportBtn.classList.toggle('hidden', !dataLoaded || pageName === 'home');
			DOM.saveJsonBtn.classList.toggle('hidden', !dataLoaded || pageName === 'home');
		}

		async function _handleReset() {
			const isConfirmed = await Utils.showConfirmationModal(
				"confirm_reset_title",
				"confirm_reset_message",
				"confirm_reset_btn"
			);
			
			if (isConfirmed) {
				Store.reset();
				CategorizeModule.destroy();
				VisualizeModule.destroy();
				
				DOM.ruleSearch.disabled = true;
				DOM.ruleCategory.disabled = true;
				DOM.ruleCategory.value = '';
				
				DOM.ruleFixcostChk.disabled = true;
				DOM.ruleFixcostChk.checked = false;
				
				Utils.showStatus("msg_session_reset", 'info');
				showPage('home');
			}
		}
		
		function _handleSaveJson() {
			const { tableData, savedRules, currentCurrency, selTopCats } = Store.getState();

			if (tableData.length === 0 && savedRules.length === 0) {
				Utils.showStatus("msg_no_data_to_save", 'info');
				return;
			}
			
			const dataToSave = {
				currency: currentCurrency, 
				rules: savedRules,
				data: tableData,
				selTopCats: selTopCats // top10 kategorien
			};
			
			const jsonString = JSON.stringify(dataToSave, null, 2);
			const blob = new Blob([jsonString], { type: 'application/json' });
			const url = URL.createObjectURL(blob);
			
			const a = document.createElement('a');
			a.href = url;
			a.download = 'Haushaltsbuch_Daten.json';
			document.body.appendChild(a);
			a.click();
			
			document.body.removeChild(a);
			URL.revokeObjectURL(url);
			
			Utils.showStatus("msg_json_saved", 'success');
		}
		
		function _handleInfoClick() {
			const lnkHtml = "<br><br><a href='mailto:arjunae@nurfuerspam.de' class='underline'>arjunae@nurfuerspam.de</a><br><a href='https://github.com/Thorsten7701/Haushaltsbuch' target='_blank' class='underline'>github.com/Thorsten7701/Haushaltsbuch</a>";
			Utils.showConfirmationModal(
				"info_modal_title",
				"info_modal_message",
				"modal_btn_close", 
				[lnkHtml],
				true 
			);
		}

		return {
			init: function() {
				DOM.navHomeBtn.addEventListener('click', () => showPage('home'));
				DOM.navImportBtn.addEventListener('click', () => showPage('import'));
				DOM.navCategorizeBtn.addEventListener('click', () => showPage('categorize'));
				DOM.navVisualizeBtn.addEventListener('click', () => showPage('visualize'));

				DOM.resetBtn.addEventListener('click', _handleReset);
				DOM.exportBtn.addEventListener('click', () => CategorizeModule.exportCsv());
				DOM.saveJsonBtn.addEventListener('click', _handleSaveJson);
				
				if (DOM.infoBtn) { 
					DOM.infoBtn.addEventListener('click', _handleInfoClick);
				}
			},
			
			showPage: showPage
		};
	})();

	window.addEventListener('DOMContentLoaded', () => {
		Utils.updateTexts();
		document.body.classList.remove('is-loading');

		ImportModule.init();
		CategorizeModule.init();
		VisualizeModule.init();
		MainController.init();
		MainController.showPage('home');
		IconLoader.run(document);
	}); 

	</script>
	</body>
</html>
